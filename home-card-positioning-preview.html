<!doctype html>
<html lang="en" data-mode="after">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahead — Home month-card positioning preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/month-story.css">
<link rel="stylesheet" href="css/home-card-clean.css?v=positioning-preview-1122">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f4ee;color:#2B2840;font-family:Figtree,system-ui,sans-serif}
  .bar{display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;max-width:1230px;margin:0 auto;padding:26px 24px 10px}
  .logo{font:800 38px/1 Nunito,sans-serif;letter-spacing:-.05em}.logo i{font-style:normal;color:#bca58e}
  h1{font:800 24px/1.1 Nunito,sans-serif;margin:0 0 6px}
  .intro{font-size:14px;line-height:1.5;color:#6a6373;max-width:540px;margin:0}
  .controls{display:flex;gap:4px;padding:5px;background:#ebe5dc;border-radius:999px}
  .controls button{font:700 14px Figtree,sans-serif;border:0;background:transparent;color:#615968;padding:10px 16px;border-radius:999px;cursor:pointer}
  html[data-mode="before"] .controls .before,
  html[data-mode="after"] .controls .after{background:white;color:#2B2840;box-shadow:0 1px 4px #2b284020}
  #main{max-width:1230px;margin:0 auto;padding:16px 24px 45px}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .cell{min-width:0}
  .month-caption{margin:0 0 5px 5px;font-size:12px;letter-spacing:.08em;font-weight:800;color:#777084;text-transform:uppercase}
  #main .ms-card{margin:0;box-sizing:border-box}
  #main .ms-card .ms-toys img{display:block}
  .hint{font-size:13px;color:#777084;margin:18px 5px}
  @media(max-width:920px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:580px){.bar{padding:20px 18px 8px;gap:14px}.grid{grid-template-columns:1fr;gap:16px}#main{padding:12px 18px 35px}.logo{font-size:32px}h1{font-size:20px}}
  /* Reapply the current live positioning in "Current" mode, only on this comparison page. */
  html[data-mode="before"] #main .ms-card{min-height:232px!important;padding:22px 20px 20px!important;grid-template-rows:auto 1fr!important}
  html[data-mode="before"] #main .ms-card .ms-copy{width:200px!important;max-width:100%!important}
  html[data-mode="before"] #main .ms-card .ms-eyebrow{margin-bottom:10px!important}
  html[data-mode="before"] #main .ms-card .ms-copy small{margin-top:10px!important;line-height:1.4!important;max-width:200px!important}
  html[data-mode="before"] #main .ms-card .ms-foot{margin-top:18px!important;align-self:end!important}
  html[data-mode="before"] #main .ms-card .ms-art{top:14px!important;right:0!important;bottom:-16px!important;width:calc(100% - 168px)!important;max-width:230px!important;height:calc(100% + 2px)!important;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 22%)!important;mask-image:linear-gradient(to right,transparent 0,#000 22%)!important}
  html[data-mode="before"] #main .ms-card .ms-babyimg img{right:0!important;bottom:0!important;transform:none!important}
</style>
</head>
<body>
<div class="bar">
  <div class="logo">ahead<i>.</i></div>
  <div>
    <h1>Home month cards — positioning only</h1>
    <p class="intro">Switch between the current card layout and the proposed spacing. Same images, copy, CTA, and colors. These are all 12 variants from the real Home card markup.</p>
  </div>
  <div class="controls" role="group" aria-label="Preview version">
    <button type="button" class="before" onclick="document.documentElement.dataset.mode='before'">Current</button>
    <button type="button" class="after" onclick="document.documentElement.dataset.mode='after'">Repositioned</button>
  </div>
</div>
<main id="main">
  <div class="grid" id="grid"></div>
  <p class="hint">Preview only · No copy or artwork changes · Nothing merged.</p>
</main>
<script>
  const BALLOON=['#f2a98a','#4da9d4','#6c91b1','#619863','#659056','#4da5d0','#e9b553','#eb9669','#e37889','#e98067','#9a6fa4','#6c77e5'];
  const mix=(hex,w,to=255)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*(1-w)+to*w).toString(16).padStart(2,'0')).join('');
  const theme=m=>{const c=BALLOON[m];return '--m-bg1:'+mix(c,.84)+';--m-bg2:'+mix(c,.92)+';--m-line:'+mix(c,.7)+';--m-ink:'+mix(c,.45,30)+';--m-chip:'+mix(c,.78)+';--ms-c1:'+mix(c,.5)+';--ms-c2:'+mix(c,.72)};
  const tease=[
    'Maya is brand new and loves being snug.',
    'Maya notices more each day, and kicks with joy.',
    'Maya smiles on purpose and is starting to coo.',
    'Maya’s hands are opening, so she can reach for toys.',
    'Everything catches Maya’s eye, even during feeds.',
    'Maya found her feet, and they’re after that ball.',
    'Halfway to one, Maya may be ready for a taste.',
    'Maya drops it. You pick it up. And she does it again.',
    'Maya knows you’re there, even out of sight.',
    'Maya is figuring out how things fit together.',
    'Maya may start pulling up on the furniture.',
    'Maya is almost one, and look how far she’s come.'
  ];
  const play='<svg viewBox="0 0 24 24"><path d="M9 7.5v9l7.5-4.5z"/></svg>';
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  document.querySelector('#grid').innerHTML=tease.map((t,m)=>'<section class="cell"><div class="month-caption">'+(m===0?'First weeks':'Month '+m)+'</div>'+
    '<button type="button" class="ms-card" aria-label="Preview '+(m===0?'first weeks':'month '+m)+'" style="'+theme(m)+'">'+
      '<span class="ms-body"><span class="ms-copy"><span class="ms-eyebrow">'+(m===0?'HER FIRST WEEKS':'THIS MONTH')+'</span>'+
      '<b class="ms-month">'+(m===0?'1 day.':'Month '+m+'.')+'</b><small>'+esc(t).replace(/([.!?]) (?=\S)/g,'$1<br>')+'</small></span>'+
      '<span class="ms-art" aria-hidden="true"><i class="ms-c2"></i><span class="ms-toys"><span class="ms-l ms-mid ms-babyw ms-babyimg"><img src="assets/home/babies/baby-'+m+'.webp?v=1122a" alt=""></span></span></span></span>'+
      '<span class="ms-foot"><span class="ms-watch"><i>'+play+'</i>'+(m===0?'Maya’s story':'Maya’s month')+'</span><span class="ms-go">→</span></span></button></section>').join('');
</script>
</body>
</html>
