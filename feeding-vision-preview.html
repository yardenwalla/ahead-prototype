<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>Ahead — Feeding vision preview</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/hub.css"><style>
:root{--cream:#f7f4ee;--ink:#292d2a;--muted:#727872;--sage:#dfeae0;--line:#e8e6df}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Figtree,system-ui,sans-serif;color:var(--ink)}.shell{max-width:480px;margin:auto;min-height:100vh;padding:18px 20px 96px}.brand{font:800 26px Nunito,sans-serif;letter-spacing:-1.6px}.dot{color:#83a28b}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.avatar{background:#e7e4dc;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-size:13px}.eyebrow{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}.title{font:800 30px/1.16 Nunito,sans-serif;letter-spacing:-.9px;margin:8px 0}.intro{color:#646c66;font-size:14px;line-height:1.55;margin:0 0 20px}.stagebar{display:flex;gap:7px;overflow:auto;padding:0 0 10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #e0e0d9;border-radius:30px;padding:9px 13px;background:#fff9;font:600 12px Figtree;cursor:pointer}.chip.active{background:#dfece1;border-color:#88a992;color:#315c42}.spotlight{background:#e5efe6;border-radius:17px;padding:19px;margin:12px 0 25px}.kicker{font-size:11px;font-weight:700;color:#54775b;text-transform:uppercase;letter-spacing:.06em}.spotlight h2{font:800 19px Nunito;margin:9px 0}.spotlight p{font-size:14px;line-height:1.55;margin:0}.spotlight .next{border-top:1px solid #cadccd;margin-top:15px;padding-top:12px;font-size:13px;line-height:1.5}.section{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}.section h2{font:800 19px Nunito;margin:0}.hint{font-size:12px;color:var(--muted)}.card{width:100%;text-align:left;background:#fff;border:1px solid #e9e7e1;border-radius:16px;padding:16px;margin:0 0 10px;display:flex;gap:14px;align-items:center;cursor:pointer;color:inherit;font:inherit;box-shadow:0 2px 10px #343a3210}.art{width:55px;height:55px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:25px;background:#f4e6eb}.card:nth-child(2) .art{background:#e9eff9}.card:nth-child(3) .art{background:#f5eddb}.card:nth-child(4) .art{background:#e5efe6}.card:nth-child(5) .art{background:#f4e9e2}.ct{font-size:15px;font-weight:700;margin:0 0 4px}.desc{font-size:12px;color:#6d756e;line-height:1.45;margin:0}.arrow{margin-left:auto;color:#8c928b;font-size:21px}.smallnote{font-size:12px;color:#788078;line-height:1.5;margin:12px 0}.back{border:0;background:none;padding:0 0 20px;color:#5b8064;font:600 14px Figtree;cursor:pointer}.detail h1{font:800 27px Nunito;margin:0 0 9px}.detail .lead{font-size:14px;color:#687269;line-height:1.5}.group{border-top:1px solid #e5e4dc;padding:17px 0}.group h3{font:800 16px Nunito;margin:0 0 7px}.group p{font-size:14px;line-height:1.55;margin:0}.footer{position:fixed;bottom:0;left:0;right:0;background:#fbfaf6;border-top:1px solid #e7e5df;display:flex;justify-content:space-around;padding:13px 0 max(14px,env(safe-area-inset-bottom));font-size:11px;color:#8a8f88}.footer b{color:#547b5e}.subtle{background:#f3f0e9;border-radius:12px;padding:13px;font-size:13px;line-height:1.5;margin-top:12px}.tag{display:inline-block;font-size:11px;background:#e6eee5;border-radius:12px;padding:4px 8px;color:#51745a;margin-bottom:9px}</style></head><body><div class="shell"><header class="top"><div class="brand">ahead<span class="dot">.</span></div><div class="avatar">A</div></header><main id="app"></main></div><footer class="footer"><span>⌂ Home</span><b>▤ Guide</b><span>◷ Timeline</span><span>♡ Memories</span></footer><script>
const stages=[
{id:'newborn',label:'Newborn',age:'0–3 months',spot:'Getting milk feeds established',now:'Learn your baby’s hunger cues, how to feed comfortably, and how to tell they’re getting enough.',next:'Coming up: feeds may become more predictable, and your baby may get distracted while eating.'},
{id:'early',label:'3–6 months',age:'3–6 months',spot:'Milk feeds are changing',now:'Your baby may feed faster, become distracted, or show early interest in food. Milk is still their nutrition.',next:'Coming up: watch for developmental readiness to start solids around 6 months.'},
{id:'start',label:'Starting solids',age:'Around 6 months',spot:'Getting ready for first foods',now:'Check readiness, choose a feeding approach, and learn how to offer iron-rich foods and allergens safely.',next:'Coming up: textures, finger foods, and cup practice.'},
{id:'explore',label:'7–9 months',age:'7–9 months',spot:'Learning to eat',now:'Keep offering new textures and flavors while your baby practices chewing, grasping, and drinking from a cup.',next:'Coming up: more shared meals and independent eating.'},
{id:'meals',label:'9–12 months',age:'9–12 months',spot:'Becoming a little eater',now:'Build a predictable meal rhythm, offer safe family foods, and encourage self-feeding.',next:'Coming up: the move away from infant formula and bottles after 12 months.'},
{id:'year',label:'12+ months',age:'12+ months',spot:'Joining family meals',now:'Focus on balanced meals, snacks, cups, and the transition to appropriate milk.',next:'Coming up: changing appetite and more independent eating.'}
];
const cats=[
['Feeding routine','🕒'],
['How to feed','🍼'],
['Milk & preparation','🥛'],
['Nutrition & growth','🥑'],
['Feeding challenges','💛']
];
const content={
newborn:[
[['Feeding frequency','Most newborns feed frequently, including overnight. Follow hunger cues and any individualized feeding plan.'],['Hunger and fullness cues','Look for rooting, hand-to-mouth movements, and active sucking before crying.'],['Sleepy feeds and cluster feeding','Learn when to wake a sleepy baby and why some evenings involve back-to-back feeds.']],
[['Nursing','Positioning, latch, and signs of effective milk transfer.'],['Bottle feeding','Paced bottle-feeding, nipple flow, and responsive feeding.'],['Burping','When to pause, try a burp, or continue feeding.']],
[['Preparing formula','Formula formats, accurate mixing, and safety precautions.'],['Storing and warming milk','Separate storage rules for breast milk and formula; thawing, warming, and leftovers.'],['Cleaning equipment','Washing and sanitizing bottles, nipples, and pump parts used to feed your baby.']],
[['Getting enough milk','Diapers, feeding behavior, and weight trends are more useful than a single feed.'],['Diapers and poop','What changes over the first days and weeks.'],['Vitamin D and iron','What to ask your pediatrician based on how your baby is fed.']],
[['Spit-up and gas','What is common and which symptoms warrant medical attention.'],['Difficulty feeding','Latch difficulty, coughing during feeds, and bottle refusal.'],['Poop changes','Normal variation and signs that need evaluation.']]],
early:[
[['Changing milk feeds','Feeds may become more efficient and spaced out, but needs vary.'],['Distracted feeding','Try a quieter environment when your baby keeps looking away.']],
[['Comfortable nursing and bottles','Adjust positioning and bottle flow as your baby grows.'],['Reading fullness cues','Let your baby guide when a feed is finished.']],
[['Milk preparation and storage','Keep quick-reference guidance for formula, expressed milk, warming, and cleaning.'],['Feeding away from home','Transport milk and supplies safely on outings.']],
[['Milk intake and growth','Keep tracking overall feeding and growth rather than forcing an ounce target.'],['Getting ready for solids','Learn readiness signs; interest alone does not mean baby is ready.']],
[['Bottle refusal','Approaches to try without pressure.'],['Distracted or fussy feeds','Common reasons and when to seek help.']]],
start:[
[['Milk and first meals','Milk remains the main source of nutrition as solids begin.'],['When to offer food','Start with a manageable routine and follow appetite.']],
[['Purées or baby-led weaning','Both can work; learn safe positioning and preparation.'],['Gagging versus choking','Understand the difference and learn infant choking first aid.'],['First spoonfuls and finger foods','Offer developmentally appropriate textures.']],
[['Milk preparation and storage','Breast-milk and formula references remain available.'],['Food preparation safety','Safe textures, cooking, and storage for first foods.']],
[['Iron-rich first foods','Prioritize sources of iron from the start.'],['Introducing allergens','Offer common allergens in age-appropriate forms, with individualized guidance when needed.'],['Water and portions','Small amounts of water with meals and responsive portions.']],
[['Food reactions','Recognize symptoms that need urgent attention.'],['Constipation and gagging','What can happen when solids begin.']]],
explore:[
[['Growing meal rhythm','Gradually build toward more regular meals while continuing milk feeds.']],
[['Textures and finger foods','Progress beyond smooth purées and support chewing practice.'],['Cup practice','Offer an open or straw cup with help.']],
[['Preparing food safely','Texture, size, storage, and choking-hazard prevention.'],['Milk handling','Existing milk storage and formula guidance stays accessible.']],
[['Variety and iron','Keep offering varied foods, especially iron-rich options.'],['Allergen exposure','Continue serving tolerated allergens regularly.']],
[['Food refusal','Repeated low-pressure exposure helps.'],['Constipation and gagging','Know common patterns and warning signs.']]],
meals:[
[['Meals and snacks','Build toward a family-style meal routine while continuing appropriate milk feeds.']],
[['Self-feeding','Encourage utensils, fingers, and cups without pressure.'],['Family foods','Modify texture and shape to reduce choking risk.']],
[['Safe food prep','Cooking, storage, choking hazards, and leftovers.'],['Milk transition ahead','Know what changes around the first birthday.']],
[['Balanced meals','Offer iron, protein, fats, fruits, vegetables, and grains across the day.'],['Appetite variation','Expect intake to change from meal to meal.']],
[['Throwing and refusing food','Respond calmly and keep mealtimes low-pressure.']]],
year:[
[['Family meals and snacks','A regular routine with flexibility for appetite.']],
[['Cups and utensils','Build independence and gradually move away from bottles.'],['Safe family meals','Serve modified family foods with choking prevention in mind.']],
[['Transitioning milk','Discuss the shift from infant formula to appropriate milk with your pediatrician.'],['Food handling','Safe preparation and storage for everyday meals.']],
[['Toddler nutrition','Iron, calcium, fats, and varied food choices.'],['Milk and appetite','Avoid letting excessive milk displace meals.']],
[['Picky eating','Low-pressure exposure and predictable routines.'],['Mealtime behavior','Manage throwing, mess, and food refusal.']]]
};
let stage='newborn',category=-1;
function render(){let s=stages.find(x=>x.id===stage);let app=document.getElementById('app');if(category<0){app.innerHTML='<div class="eyebrow">YOUR BABY’S GUIDE / FEEDING</div><h1 class="title">Feeding</h1><p class="intro">What your baby needs now, and how feeding changes as they grow.</p><div class="eyebrow" style="margin-bottom:9px">EXPLORE A STAGE</div><div class="stagebar">'+stages.map(x=>'<button class="chip '+(x.id===stage?'active':'')+'" data-stage="'+x.id+'">'+x.label+'</button>').join('')+'</div><section class="spotlight"><div class="kicker">'+s.age+' · Worth knowing now</div><h2>'+s.spot+'</h2><p>'+s.now+'</p><div class="next"><strong>Get ahead</strong> · '+s.next+'</div></section><div class="section"><h2>Your feeding guide</h2><span class="hint">5 topics</span></div>'+cats.map((x,i)=>'<button class="card" data-cat="'+i+'"><div class="art">'+x[1]+'</div><div><p class="ct">'+x[0]+'</p><p class="desc">'+content[stage][i].map(z=>z[0]).slice(0,3).join(' · ')+'</p></div><span class="arrow">›</span></button>').join('')+'<p class="smallnote">The categories stay familiar. Guidance changes with your baby’s stage, and earlier references remain accessible.</p>'}else{let c=cats[category];app.innerHTML='<button class="back" id="back">← Feeding</button><div class="eyebrow">'+s.age+'</div><h1 class="title">'+c[0]+'</h1><p class="intro">What matters for your baby at this stage.</p>'+content[stage][category].map(x=>'<section class="group"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></section>').join('')+'<div class="subtle">Preview content map · Existing detailed guides and source references would be preserved when integrating this structure into the app.</div>'}document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=b.dataset.stage;render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=+b.dataset.cat;render();scrollTo(0,0)});let back=document.getElementById('back');if(back)back.onclick=()=>{category=-1;render()}}
render();</script></body></html>
