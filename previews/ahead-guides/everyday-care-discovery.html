<script>(function bootstrap(){
  const state=new Map();
  const now=new Date();
  const day=Math.min(now.getDate(),28);
  const born=new Date(now.getFullYear(),now.getMonth()-5,day,12);
  const dob=[born.getFullYear(),String(born.getMonth()+1).padStart(2,'0'),String(born.getDate()).padStart(2,'0')].join('-');
  state.set('ahead-v2-profile',JSON.stringify({name:'Ari',pronouns:'he',dob:dob,early:false,due:'',feed:'Both',feedHow:'Nursing'}));
  const storage={
    getItem(k){return state.has(String(k))?state.get(String(k)):null},
    setItem(k,v){state.set(String(k),String(v))},
    removeItem(k){state.delete(String(k))},
    clear(){state.clear()},
    key(n){return [...state.keys()][n]||null},
    get length(){return state.size}
  };
  Object.defineProperty(window,'localStorage',{configurable:true,value:storage});
})();</script>

       </div>
     </header>`;
    const practice=`<div class="cp-adjust"><span class="cp-adjust-mark">✓</span><span><small>The little adjustment</small><p>${F(st.adjustment)}</p></span></div>`;
    const main=`<section class="cp-featured"><h2 class="hub-h2">Caring for ${esc(who())} now</h2>
       <div class="cp-guide-list">${st.featured.map(row).join('')}</div></section>`;
    const more=`<details class="cp-more"><summary><span>More care topics</span><span class="cp-more-chevron" aria-hidden="true">⌄</span></summary>
       <div class="cp-guide-list">${st.more.map(row).join('')}</div></details>`;
    const help=`<button class="hub-rough-card care-rash-card cp-help" onclick="openPage('chg:Daily rhythm:d:look:${v}')">
       <span class="hub-rough-moon" aria-hidden="true">${hubArt('eye',CAT)}</span>
       <span class="hub-rough-copy"><b>Something look off?</b><small>Rashes, poop, skin and more</small></span>
       <span class="hub-chev" aria-hidden="true">›</span></button>`;
    const next= v<3?`<button class="cp-next" onclick="openPage('chg:Daily rhythm:s:${v+1}')"><span><small>Coming up</small><b>${F(st.next)}</b></span><span>›</span></button>`
      :`<button class="cp-next" onclick="openPage('chg:Daily rhythm:d:after1')"><span><small>Coming up</small><b>${F(st.next)}</b></span><span>›</span></button>`;
    return `<div class="quiet-category hub-page care-v2 care-discovery-preview" data-overview="${CAT}" data-care-stage="${v}" style="${yearTheme(CAT)}">
      ${typeof monthlyPageHeader==='function'?monthlyPageHeader(CAT):''}${pills}${basis}
      ${hero}${practice}${main}${more}${help}${next}
      <p class="hub-foot">Ages are typical. Your baby moves at their own pace.</p></div>`;
  };
  openPage('topic:Daily rhythm');
})();</script>
</body>
</html>
