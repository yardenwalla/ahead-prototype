<script>(function storageShim(){
  const mem=new Map();
  const d=new Date();d.setMonth(d.getMonth()-5);
  const fmt=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")].join("-");
  mem.set("ahead-v2-profile",JSON.stringify({name:"Maya",pronouns:"she",dob:fmt(d),due:"",early:false,feed:"Breast milk",example:true}));
  mem.set("ahead-v2-answers",JSON.stringify({roll:"Yes",rollDirection:"Both ways",hasTooth:"No",tooth:"No"}));
  const store={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,String(v)),removeItem:k=>mem.delete(k),clear:()=>mem.clear(),key:i=>Array.from(mem.keys())[i]??null,get length(){return mem.size}};
  try{Object.defineProperty(window,"localStorage",{configurable:true,value:store})}catch(e){}
  try{Object.defineProperty(window,"sessionStorage",{configurable:true,value:store})}catch(e){}
})();</script>
