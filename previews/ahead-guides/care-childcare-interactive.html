<script>(function demo(){
  const memory=new Map(),d=new Date();d.setMonth(d.getMonth()-5);
  const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
  memory.set("ahead-v2-profile",JSON.stringify({name:"Maya",pronouns:"she",dob:iso(d),due:"",early:false,feed:"Breast milk",example:true}));
  memory.set("ahead-v2-answers",JSON.stringify({roll:"Yes",rollDirection:"Both ways",hasTooth:"No",tooth:"No",cordHealed:"Yes"}));
  const store={getItem:k=>memory.has(k)?memory.get(k):null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k),clear:()=>memory.clear(),key:i=>Array.from(memory.keys())[i]??null,get length(){return memory.size}};
  try{Object.defineProperty(window,"localStorage",{configurable:true,value:store})}catch(e){}
  try{Object.defineProperty(window,"sessionStorage",{configurable:true,value:store})}catch(e){}
})();</script>
