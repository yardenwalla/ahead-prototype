<style>
:root{--ink:#2c4136;--muted:#768178;--bg:#fbfaf7;--card:#fffefa;--line:#e7e7df;--sage:#466a55;--warm:#f2e4ce;--warmdeep:#7b613b;--display:Nunito,'Trebuchet MS',sans-serif;--body:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eeeee8;color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #91b39e;outline-offset:3px}button:disabled{cursor:default;opacity:.5}a{color:#406b55}.shell{background:var(--bg);max-width:432px;min-height:100vh;margin:0 auto;box-shadow:0 12px 80px #1d2b1d10;padding-bottom:35px;position:relative}.wrap{padding:0 23px}.top{display:flex;align-items:center;justify-content:space-between;padding-top:21px;padding-bottom:25px}.logo{font:900 26px/.9 var(--display);letter-spacing:-1.7px}.baby-pill{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:99px;color:#4c6755;font-size:11.5px;font-weight:700;display:flex;gap:7px;align-items:center}.baby-pill svg{width:12px;height:12px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:var(--display)}h1{font-size:34px;letter-spacing:-1.2px;line-height:1.12;font-weight:900}h2{font-size:24px;letter-spacing:-.55px;line-height:1.18;font-weight:900}h3{font-size:19px;line-height:1.24;font-weight:900;letter-spacing:-.25px}.lead{font-size:13px;color:#798278;margin-top:7px;line-height:1.55}.eyebrow{font-weight:800;letter-spacing:.115em;font-size:10px;color:#7b805d;text-transform:uppercase}.muted{color:var(--muted)}.headrow{margin-bottom:18px}.hero{background:linear-gradient(145deg,#f3e4cf 0%,#f8ede0 90%);border-radius:23px;padding:21px 20px 20px;position:relative;overflow:hidden;min-height:375px}.hero:before{content:'';position:absolute;width:195px;height:195px;right:-43px;top:-55px;border:1px solid #d9be96;border-radius:50%;opacity:.43}.hero .stage-label{font-size:10.5px;color:#846941;font-weight:800;letter-spacing:.11em;position:relative;z-index:2}.hero-art{width:170px;height:140px;margin:7px 0 1px auto;display:flex;align-items:center;justify-content:center;position:absolute;right:3px;top:16px;pointer-events:none}.hero-art svg{width:100%;height:100%}.hero h2{max-width:230px;font-size:26px;line-height:1.16;color:#443d32;margin-top:113px;position:relative;z-index:2}.hero .hero-desc{font-size:12.8px;color:#70685b;line-height:1.56;margin-top:9px;max-width:355px;position:relative;z-index:2}.hero-action{width:100%;border:0;border-radius:13px;background:#2e5140;color:white;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;margin-top:19px;text-align:left;font-size:12.8px;font-weight:800}.hero-action svg{width:18px;height:18px}.meter{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#7b6d59;margin-top:16px;gap:12px}.meterline{height:5px;background:#e2d1b7;border-radius:9px;flex:1;overflow:hidden}.meterline i{display:block;height:100%;background:#6e8c70;border-radius:9px;transition:width .22s}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-title h3{font-size:18px}.section-title small{font-size:11px;color:#899086}.next-task{border:1px solid #e9e8e0;background:#fffefa;border-radius:18px;padding:14px;display:flex;align-items:center;gap:11px;text-align:left;width:100%}.mini-art{width:57px;height:57px;flex:0 0 auto;background:#eef2e9;border-radius:15px;display:grid;place-items:center;color:#5d876f}.mini-art svg{width:30px;height:30px}.mini-copy{flex:1;min-width:0}.mini-copy b{display:block;font-size:13px;font-weight:800;line-height:1.38}.mini-copy span{display:block;color:#7c867b;font-size:11.5px;margin-top:4px;line-height:1.43}.chev{width:16px;height:16px;flex:0 0 auto;color:#829185}.linkline{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);width:100%;background:none;padding:18px 1px;text-align:left}.linkline .small-icon{width:35px;height:35px;flex:none;border-radius:10px;background:#ebf0e9;display:grid;place-items:center;color:#66846c}.linkline .small-icon svg{width:18px;height:18px}.linkline b{display:block;font-size:12.7px;font-weight:7 60}.focus-card .badge{padding:5px 9px;font-size:10px;border-radius:20px;color:#56745e;background:#e0eee0;font-weight:750}.focus-card .badge.na{background:#ebe5db;color:#7b705e}.steps-list{list-style:none;padding:0;margin:17px 0 0}.steps-list li{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #e9e8df;font-size:12.6px;line-height:1.58}.steps-list li:last-child{border-bottom:0}.num{border-radius:50%;width:23px;height:23px;flex:none;background:#eaf0e8;color:#53715c;display:grid;place-items:center;font-size:11px;font-weight:900}.note-box{margin-top:14px;background:#f6f3ec;border:1px solid #e9e3d8;border-radius:13px;padding:12px 13px;font-size:12px;color:#685f53;line-height:1.5}.note-box strong{display:block;color:#5a564a;margin-bottom:4px}.actions{margin-top:18px;display:grid;gap:9px}.primary{border:0;background:#325640;color:#fff;border-radius:13px;padding:14px 15px;font-size:12.8px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}.secondary{border:1px solid #dfe4dc;border-radius:13px;background:white;color:#56735c;padding:13px;font-size:12.3px;font-weight:750;width:100%}.tertiary{background:none;border:0;font-size:12px;color:#718875;font-weight:750;padding:10px}.success-card{text-align:center;background:#e7efe4;border-radius:20px;padding:25px 18px;margin:22px 0}.success-card h2{margin:10px 0 8px}.success-card p{font-size:12px;line-height:1.6;color:#6e8170}.success-mark{background:#648568;color:#fff;border-radius:50%;display:grid;place-items:center;width:46px;height:46px;margin:0 auto}.success-mark svg{width:26px;height:26px}.stage-list{margin-top:22px;border-top:1px solid var(--line)}.checkrow{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}.checkrow .state-dot{width:26px;height:26px;border:1px solid #cdd9cc;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}.checkrow .state-dot.done{background:#77957b;border-color:#77957b}.checkrow .state-dot.na{background:#e8e6df;border-color:#e0dfd7;color:#8b8b83}.checkrow b{font-size:12.8px;line-height:1.35;display:block}.checkrow small{font-size:11.2px;line-height:1.45;color:#858e84;display:block;margin-top:2px}.checkrow .checkcopy{flex:1}.checkrow svg{width:16px;height:16px;color:#8da18f}.hint-row{font-size:11.5px;line-height:1.45;color:#858e84;padding:10px 0}.between{display:flex;align-items:center;justify-content:space-between}.stage-preview{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:20px;display:flex;align-items:center;gap:11px}.stage-preview b{font-size:12.5px}.stage-preview small{font-size:11px;color:#879087;display:block;margin-top:4px}.sheet-backdrop{position:fixed;inset:0;background:#1b2b2280;display:flex;align-items:flex-end;justify-content:center;z-index:40}.sheet{width:min(432px,100vw);max-height:85vh;overflow-y:auto;border-radius:24px 24px 0 0;background:#fcfbf7;padding:22px 23px 35px;box-shadow:0 -10px 45px #0002}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.x{width:32px;height:32px;display:grid;place-items:center;border:0;background:#f0f0ea;border-radius:50%;font-size:19px;color:#627365}.sheet h2{font-size:23px}.sheet p{font-size:12.2px;line-height:1.6;color:#7b8479}.age-opt{display:flex;width:100%;align-items:center;gap:12px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.age-opt .ageball{width:41px;height:41px;border-radius:13px;background:#e9eee6;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#63785f}.age-opt b{font-size:13px;display:block}.age-opt small{font-size:11px;color:#879087;display:block;margin-top:3px}.age-opt>svg{width:17px;margin-left:auto;color:#4f7b5b}.search{display:flex;gap:9px;align-items:center;border:1px solid #e0e6df;background:white;border-radius:14px;padding:11px 13px;margin-bottom:11px}.search svg{width:17px;height:17px;color:#839886}.search input{border:0;outline:0;background:transparent;font-size:12.5px;width:100%;color:#2a4735}.library-group{margin:21px 0 5px}.library-group h3{font-size:15px;margin-bottom:7px}.pillstatus{font-size:10px;font-weight:800;border-radius:18px;background:#e7efe4;color:#658367;padding:4px 8px;white-space:nowrap}.pillstatus.na{background:#f1eee7;color:#8a8174}.reference{background:#f1f3ed;border-radius:17px;padding:16px;margin-top:19px}.reference h3{font-size:17px}.reference p{font-size:12px;color:#6e806c;line-height:1.6;margin-top:8px}.resource-link{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11.7px;text-decoration:none;font-weight:750;line-height:1.45}.divider{height:1px;background:var(--line);margin:23px 0 18px}.emergency-item{padding:16px 0;border-bottom:1px solid var(--line)}.emergency-item b{display:block;font-size:14px;margin-bottom:6px}.emergency-item p{font-size:12px;line-height:1.62;color:#67766a}.emergency-item a{display:inline-flex;margin-top:10px;font-weight:800;font-size:12px;text-decoration:none;color:#3b6c4d}.footer{text-align:center;margin-top:25px;padding:0 22px;font-size:10px;color:#9b9f97;line-height:1.6}@media(max-width:460px){body{background:var(--bg)}.shell{box-shadow:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body><div class="shell"><div class="wrap"><header class="top"><div class="logo">ahead.</div><button id="baby" class="baby-pill" aria-label="Change preview baby stage">Maya · 5 months <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button></header><main id="main" aria-live="polite"></main></div><div class="footer" id="footer">Interactive design preview · No changes to the main Ahead app.</div></div><div id="overlay"></div>
<script>
(()=>{'use strict';
const SOURCES={cpsc:'https://www.cpsc.gov/safety-education/safety-guides/kids-and-babies/Childproofing-Your-Home',nhtsa:'https://www.nhtsa.gov/car-seats-and-booster-seats/how-install-rear-facing-car-seats',cords:'https://www.cpsc.gov/gocordless',aap:'https://www.healthychildren.org/English/safety-prevention/at-home/Pages/home-safety-heres-how.aspx',pool:'https://www.poolsafely.gov/parents/safety-tips/',poison:'https://www.poisonhelp.org/',firstaid:'https://www.redcross.org/take-a-class/resources/learn-first-aid/infant-choking'};
const STEPS={
seat:{title:'Install the car seat rear-facing',short:'A secure fit for every ride',zone:'Travel',icon:'car',why:'The first ride home is when your baby needs a correctly installed rear-facing car seat.',steps:['Install rear-facing in the back seat, following both the car seat and vehicle manuals.','Keep harness straps at or below shoulder level, snug enough that you cannot pinch slack; the chest clip sits at armpit level.','Keep Maya rear-facing until she reaches the seat manufacturer’s rear-facing height or weight limit.'],tip:'A trained child passenger safety technician can check the installation. Many local appointments are free.',source:[['Car-seat installation · NHTSA',SOURCES.nhtsa]],linked:'Outings & travel'},
sleep:{title:'Set up a safe sleep space',short:'Firm, flat and empty',zone:'Sleep space',icon:'moon',why:'A firm, flat sleep surface with no loose items is important from the first night.',steps:['Place Maya on her back for every sleep, on a firm, flat crib or bassinet mattress.','Use only a fitted sheet. Keep pillows, blankets, bumpers, positioners and toys out of the sleep space.','Use a sleep surface that meets current safety standards and follow the manufacturer’s instructions.'],tip:'Safe sleep has its full guide in Sleep; this check is shown here so it isn’t missed during first setup.',source:[['Sleep products · CPSC',SOURCES.cpsc]],linked:'Sleep'},
cribspot:{title:'Move the crib away from windows and cords',short:'Check blinds and monitor cords',zone:'Sleep space',icon:'window',why:'Blind, shade and monitor cords can pose a strangulation risk even before a baby can roll.',steps:['Place the crib or bassinet away from windows and window coverings.','Choose cordless blinds or shades wherever a child can reach them.','Keep baby monitor and other electrical cords at least three feet from the sleep space.'],tip:'Cordless coverings are the safest option. Tying cords high does not eliminate the risk.',source:[['Window cords · CPSC',SOURCES.cords]],linked:'Sleep'},
changing:{title:'Set up a safe changing spot',short:'Supplies nearby; one hand on Maya',zone:'Everyday spaces',icon:'baby',why:'Rolling can happen without warning. A floor-level changing spot is often the simplest safe option.',steps:['Put diapers, wipes and spare clothes within arm’s reach before a change.','On a raised changing table, use the provided strap and keep one hand on Maya.','Or change her on a mat on the floor. Never leave her unattended on a bed or sofa.'],tip:'This links to the diaper-changing walkthrough in Everyday Care.',source:[['Home safety · AAP',SOURCES.aap]],linked:'Everyday care'},
gear:{title:'Check swings and bouncers',short:'Straps, limits and never for sleep',zone:'Baby gear',icon:'armchair',why:'Swings and bouncers need careful placement and should not be used as sleep spaces.',steps:['Follow the product’s age and weight limits; stop when Maya can sit up or tries to climb out if the product instructions require it.','Use restraints correctly and keep the product on the floor, not a table or couch.','If she falls asleep, transfer her to a firm, flat sleep space on her back.'],tip:'Review every gear item you actually own; you do not need to buy additional gear.',source:[['Baby safety · CPSC',SOURCES.cpsc]],linked:'Everyday care'},
alarms:{title:'Check smoke and carbon monoxide alarms',short:'Test monthly and replace batteries as directed',zone:'Home basics',icon:'bell',why:'Working alarms protect the whole household and are worth checking from day one.',steps:['Confirm smoke and carbon monoxide alarms are installed where required by local code and product instructions.','Test each alarm monthly using its test button.','Replace batteries and units according to the manufacturer’s instructions.'],tip:'Make this part of a household routine; it does not require a baby-tracking habit.',source:[['Home safety · CPSC',SOURCES.cpsc]]},
hotwater:{title:'Set the water heater to 120°F or lower',short:'Lower the risk of scald burns',zone:'Home basics',icon:'droplets',why:'Very hot tap water can burn a baby quickly.',steps:['Set the water heater to no more than 120°F (49°C), if you control the setting.','Test bathwater with your wrist or a bath thermometer; it should feel comfortably warm, not hot.','Keep a hand on Maya throughout every bath.'],tip:'If you cannot adjust the heater, ask your landlord or building manager and carefully test bathwater.',source:[['Childproofing devices · CPSC',SOURCES.cpsc]],linked:'Everyday care'},
swaddle:{title:'Stop swaddling at the first signs of rolling',short:'Arms free as soon as rolling begins',zone:'Sleep space',icon:'moon',why:'A swaddled baby who rolls can have trouble moving into a safer position.',steps:['Stop swaddling at the first signs Maya is trying to roll, even if that is earlier than expected.','Choose a non-weighted sleep sack or wearable blanket with her arms free.','Continue placing her on her back at the start of every sleep.'],tip:'The detailed swaddling transition lives in Sleep. Do not use weighted swaddles or weighted sleep sacks.',source:[['Swaddling and rolling · AAP','https://www.healthychildren.org/English/ages-stages/baby/diapers-clothing/Pages/Swaddling-Is-it-Safe.aspx']],linked:'Sleep'},
bassinet:{title:'Check whether the bassinet is still safe',short:'Read its weight and mobility limits',zone:'Sleep space',icon:'bed',why:'Some bassinets must stop being used when a baby pushes up or begins to roll, even before reaching the weight limit.',steps:['Check your bassinet’s instructions for the precise weight, height and developmental limits.','Move to a suitable crib when Maya reaches any of those limits.','Keep the new crib clear, firm and flat.'],tip:'The age to transition varies with the bassinet; follow your model’s instructions.',source:[['Sleep products · CPSC',SOURCES.cpsc]],linked:'Sleep'},
small:{title:'Clear small objects from floor level',short:'Coins, batteries, magnets and toy parts',zone:'Floor & play',icon:'shapes',why:'The first roll brings small objects closer. Babies put things into their mouths before parents expect it.',steps:['Get down to floor level and scan the spaces Maya will play in.','Remove coins, magnets, small toy parts and anything that fits through an empty toilet-paper tube.','Check remotes and toys for battery compartments secured with screws; store spare batteries out of reach.'],tip:'Suspected button-battery ingestion is an emergency: go to the emergency department immediately.',source:[['Home safety · AAP',SOURCES.aap]]},
bags:{title:'Give visitors’ bags a high place',short:'Keep medicines and small items off the floor',zone:'Floor & play',icon:'bag',why:'Purses and backpacks can hold medication, gum, batteries and other items a curious baby could swallow.',steps:['Choose an up-high spot for purses, backpacks and coats.','Ask visitors to put bags there as soon as they arrive.','Keep all medications secured up high and ideally locked; child-resistant caps are not childproof.'],tip:'This is an easy check to forget when someone new visits.',source:[['Home safety · AAP',SOURCES.aap]]},
gates:{title:'Fit the stair gates',short:'Hardware-mounted at the top',zone:'Stairs & rooms',icon:'columns',why:'Crawling can make stairs reachable very quickly.',steps:['Use a properly fitted, hardware-mounted gate at the top of stairs.','At the bottom of stairs, use a suitable gate installed according to its instructions.','Check that the gate latches securely after every opening.'],tip:'Do not use wheeled baby walkers; they allow babies to reach hazards fast and can cause falls.',source:[['Childproofing devices · CPSC',SOURCES.cpsc]]},
storage:{title:'Secure low cupboards and drawers',short:'Medicines, cleaners, knives and bags',zone:'Kitchen & storage',icon:'lock',why:'Crawling babies can open drawers and low cupboards long before they understand what is dangerous.',steps:['Latch cabinets and drawers containing cleaners, detergent pods, medicines, knives, matches or plastic bags.','Store medication and toxic products up high and locked away.','Restrict access to laundry areas, garages and other high-risk rooms.'],tip:'Test latches after installing them, and re-latch every time.',source:[['Home safety · CPSC',SOURCES.cpsc]]},
outlets:{title:'Protect outlets and loose cords',short:'Floor-level electricity and trip hazards',zone:'Floor & play',icon:'plug',why:'Outlets, chargers and dangling cords sit at exactly the level crawling babies explore.',steps:['Use tamper-resistant outlets or covers that cannot easily be removed or swallowed.','Move charging, lamp and other cords out of reach.','Check regularly for damaged cords and broken covers.'],tip:'Tamper-resistant receptacles with built-in shutters are a strong long-term option.',source:[['Childproofing devices · CPSC',SOURCES.cpsc]]},
mattress:{title:'Lower the crib mattress before sitting',short:'Follow the crib’s height-setting instructions',zone:'Sleep space',icon:'bed',why:'As Maya learns to sit and pull up, a high mattress position can create a fall risk.',steps:['Check the crib instructions for when to lower the mattress.','Lower it before Maya can sit or pull up, as directed by the manufacturer.','Keep the crib clear of items that could be used as steps.'],tip:'The crib setup walkthrough lives in Sleep.',source:[['Sleep products · CPSC',SOURCES.cpsc]],linked:'Sleep'},
anchor:{title:'Anchor dressers, shelves and TVs',short:'Prevent furniture tip-overs',zone:'Furniture',icon:'archive',why:'Pulling up turns furniture into a handhold. Heavy furniture and TVs can tip onto a child.',steps:['Secure dressers, bookcases and tall furniture to studs or suitable wall anchors, following product instructions.','Mount TVs to the wall or anchor them to their stands.','Anchor furniture before Maya can reach or climb on it, even if it feels heavy.'],tip:'Don’t wait until the first time she pulls up. Furniture tip-overs can happen suddenly.',source:[['Furniture anchoring · CPSC',SOURCES.cpsc]]},
windows:{title:'Make windows and blinds safe',short:'Stops, guards and cordless coverings',zone:'Windows',icon:'window',why:'Standing brings window ledges and blind cords into reach.',steps:['Install appropriate window guards or stops; screens alone do not prevent falls.','Limit window openings to four inches or less while ensuring at least one usable emergency-escape window per room.','Use cordless coverings and keep climbable furniture away from windows.'],tip:'Move furniture away from windows even if you’ve installed other protections.',source:[['Window guards · CPSC',SOURCES.cpsc],['Cordless coverings · CPSC',SOURCES.cords]]},
kitchen:{title:'Check the stove and oven',short:'Knobs, hot handles and an open oven',zone:'Kitchen & storage',icon:'flame',why:'When Maya stands, she can reach more hot surfaces and controls.',steps:['Use appropriate stove-knob controls or covers if knobs are within reach.','Use back burners when practical and turn pot handles inward.','Secure the oven door as appropriate and confirm the range is fitted with its anti-tip bracket.'],tip:'Keep hot drinks and cooking handles away from edges even before pulling up begins.',source:[['Childproofing devices · CPSC',SOURCES.cpsc]]},
water:{title:'Make toilets, buckets and tubs safer',short:'Even a little water can be dangerous',zone:'Water',icon:'waves',why:'Babies can drown quickly and quietly in very shallow water.',steps:['Keep bathroom and laundry doors secured when Maya is exploring.','Empty buckets, tubs and other water containers immediately after use.','Stay within arm’s reach for every bath and around any water.'],tip:'This is an everyday household safety check, whether or not you have a pool.',source:[['Pool safety · CPSC',SOURCES.pool]]},
pool:{title:'Secure pool and spa access',short:'A four-sided fence and a self-closing gate',zone:'Water',icon:'waves',why:'Pools and spas need layered barriers even when adults are careful.',steps:['Install a four-sided fence around the pool or spa with a self-closing, self-latching gate.','Keep access doors secured and check drain covers for safety.','Assign a responsible adult to actively watch children whenever they are near water.'],tip:'If your home has no pool or spa, mark this check as not applicable. Keep the separate household-water check.',source:[['Pool safety · CPSC',SOURCES.pool]]},

const qs=s=>document.querySelector(s); const S=()=>STAGES.find(x=>x.id===state.stage)||STAGES[1];const status=id=>state.status[id]||''; const reviewed=id=>status(id)==='done'||status(id)==='na';const progress=st=>({done:st.ids.filter(id=>reviewed(id)).length,all:st.ids.length});const remaining=st=>st.ids.filter(id=>!reviewed(id));
function walkStage(id){state.stage=id;state.view='home';state.focus=null;state.openSheet=false;state.query='';persist();render(true)}
function changeView(view,focus){state.view=view;state.focus=focus||null;state.openSheet=false;state.showStageList=false;state.ack='';render(true)}
function setStatus(id,val){const was=status(id);state.status[id]=was===val?'':val;persist();if(state.view==='sweep'&&state.focus===id&&state.status[id]){const next=remaining(S())[0];state.focus=next||null;state.ack=val==='done'?'Marked done':'Marked not applicable';render(true)}else{render()}}
function illustration(kind){if(kind==='roll')return `<svg viewBox="0 0 210 155" fill="none"><ellipse cx="112" cy="139" rx="88" ry="7" fill="#B8B6A6" opacity=".2"/><ellipse cx="110" cy="89" rx="72" ry="42" fill="#D1DFCE"/><path d="M52 109Q32 102 40 88Q48 68 64 84" stroke="#9CBBA4" stroke-width="6" stroke-linecap="round"/><path d="M65 95q10-26 46-20t41 31q-5 17-35 17H91q-26-3-26-28" fill="#B4C6AC"/><circle cx="80" cy="85" r="28" fill="#EBC4A9"/><path d="M53 81q-6-30 23-31q27-1 30 23q-13-10-24-11q-15 17-29 19" fill="#796B5D"/><circle cx="69" cy="87" r="2" fill="#57483B"/><circle cx="83" cy="87" r="2" fill="#57483B"/><path d="M69 99q9 7 16-1" stroke="#9D7163" stroke-width="2" stroke-linecap="round"/><path d="M134 95q20-28 38-9" stroke="#EBC4A9" stroke-width="12" stroke-linecap="round"/><circle cx="172" cy="88" r="8" fill="#EBC4A9"/><circle cx="173" cy="119" r="12" fill="#E1B966"/><circle cx="173" cy="119" r="4" fill="#FBF7EA"/><rect x="18" y="112" width="20" height="18" rx="4" fill="#D9917C" transform="rotate(-13 18 112)"/></svg>`;
if(kind==='crawl')return `<svg viewBox="0 0 210 155" fill="none"><ellipse cx="108" cy="136" rx="90" ry="8" fill="#A8B6A2" opacity=".2"/><rect x="35" y="99" width="143" height="30" rx="16" fill="#C9D9C5"/><path d="M68 99q-10-23 13-30q38-13 68 19l-4 26-45-2" fill="#AEC5BB"/><circle cx="65" cy="80" r="27" fill="#E7BEA5"/><path d="M40 77q-1-26 24-29q24-2 28 20-14-9-24-9-9 14-28 18" fill="#7B6B5E"/><circle cx="59" cy="84" r="2" fill="#5B4E43"/><circle cx="73" cy="84" r="2" fill="#5B4E43"/><path d="M61 96q6 5 12 0" stroke="#A27863" stroke-width="2"/><path d="M141 97q19 6 24 23" stroke="#E7BEA5" stroke-width="11" stroke-linecap="round"/><path d="M95 101q-17 6-20 23" stroke="#E7BEA5" stroke-width="11" stroke-linecap="round"/><circle cx="180" cy="65" r="13" fill="#DBAC68"/><circle cx="180" cy="65" r="4" fill="#FBF0DF"/></svg>`;
if(kind==='stand')return `<svg viewBox="0 0 210 155" fill="none"><rect x="149" y="17" width="35" height="105" rx="5" fill="#A7B9AC"/><rect x="138" y="20" width="58" height="12" rx="4" fill="#7B9B87"/><rect x="150" y="120" width="7" height="29" rx="2" fill="#7B9B87"/><rect x="175" y="120" width="7" height="29" rx="2" fill="#7B9B87"/><circle cx="88" cy="50" r="26" fill="#EBC5AB"/><path d="M63 45q1-30 26-29q24 1 26 27-13-12-24-12-8 12-28 14" fill="#75665A"/><circle cx="81" cy="52" r="2" fill="#5D4B42"/><circle cx="95" cy="52" r="2" fill="#5D4B42"/><path d="M82 63q5 4 12 0" stroke="#A47568" stroke-width="2"/><path d="M69 79q22-8 45 0l1 45H65z" fill="#B4CFBD"/><path d="M103 85q27-4 38-31" stroke="#EBC5AB" stroke-width="11" stroke-linecap="round"/><path d="M71 125q-14 11-18 23M106 125q15 11 17 23" stroke="#EBC5AB" stroke-width="14" stroke-linecap="round"/><path d="M53 148h-13m82 0h14" stroke="#6A836B" stroke-width="7" stroke-linecap="round"/></svg>`;
return `<svg viewBox="0 0 210 155" fill="none"><ellipse cx="105" cy="140" rx="83" ry="7" fill="#D1C1AD" opacity=".3"/><rect x="70" y="41" width="96" height="90" rx="13" fill="#D9E6D7" stroke="#9BB4A1" stroke-width="2"/><path d="M84 58h68M84 83h68M84 108h68M90 42v90m68-90v90" stroke="#AEC2AE" stroke-width="3"/><circle cx="61" cy="101" r="23" fill="#EBC4AA"/><path d="M37 96q-2-24 23-23 18 1 23 22-15-9-24-9-10 9-22 10" fill="#77695B"/><circle cx="53" cy="102" r="2" fill="#5C4D41"/><circle cx="66" cy="102" r="2" fill="#5C4D41"/><path d="M56 113q5 4 9 0" stroke="#A77B67" stroke-width="2"/><path d="M78 124q22-18 39-4" stroke="#EBC4AA" stroke-width="12" stroke-linecap="round"/><ellipse cx="81" cy="126" rx="34" ry="16" fill="#ABC1B5"/></svg>`}
function pageHome(){const st=S(),p=progress(st),n=remaining(st),first=n[0],next=STAGES[STAGES.indexOf(st)+1],seen=state.milestones[st.id],start=first?STEPS[first]:null;const prior=STAGES.slice(0,STAGES.indexOf(st)).flatMap(g=>g.ids).filter(id=>!reviewed(id));return `<div class="headrow"><h1>Safety</h1><p class="lead">A little ahead of every new move.</p></div><section class="hero"><div class="stage-label">${seen&&st.id!=='setup'?'MAYA IS '+st.name.toUpperCase():st.period}</div><div class="hero-art">${illustration(st.art)}</div><h2>${seen&&st.id!=='setup'?st.headlineNow:st.headline}</h2><p class="hero-desc">${st.sub}</p><button class="hero-action" data-action="sweep"><span>${n.length?`Get ready · ${n.length} ${n.length===1?'check':'checks'} to review`:'Review these checks'}</span>${icon('arrow',18)}</button><div class="meter"><span>${p.done} of ${p.all} reviewed</span><span class="meterline"><i style="width:${100*p.done/p.all}%"></i></span></div></section>${first?`<div class="section-title"><h3>Start with this</h3><small>ONE THING AT A TIME</small></div><button class="next-task" data-action="step" data-id="${first}"><span class="mini-art">${icon(start.icon,29)}</span><span class="mini-copy"><b>${start.title}</b><span>${start.short}</span></span>${icon('chevron',16)}</button>`:`<div class="success-card"><div class="success-mark">${icon('check',25)}</div><h3>All this stage’s checks are reviewed.</h3><p>As Maya grows, return here for the next things to consider.</p></div>`}${prior.length?`<button class="linkline" data-action="earlier"><span class="small-icon">${icon('clock')}</span><span><b>Earlier setup worth reviewing</b><small>${prior.length} checks from earlier stages, if not already done</small></span>${icon('chevron',16)}</button>`:''}${next?`<button class="upcoming" data-action="stage" data-id="${next.id}"><span class="up-ico">${icon('spark',22)}</span><span><small>COMING UP AFTER ${st.name.toUpperCase()}</small><b>${next.name}: ${st.nextSub||'More things Maya can reach'}</b></span>${icon('chevron',16)}</button>`:`<div class="upcoming" role="note"><span class="up-ico">${icon('spark',22)}</span><span><small>LOOKING AHEAD</small><b>More changes come with walking and climbing.</b></span></div>`}<div class="quiet-links"><button class="linkline" data-action="library"><span class="small-icon">${icon('search')}</span><span><b>Find a safety check</b><small>All rooms, gear and stages</small></span>${icon('chevron',16)}</button><button class="linkline" data-action="emergency"><span class="small-icon">${icon('shield')}</span><span><b>If something goes wrong</b><small>Poison Help, emergency numbers and first aid</small></span>${icon('chevron',16)}</button></div><p class="tiny-note">Ages are typical. We recommend preparing before a new skill appears. In the full app, this stage would follow Maya’s development.</p>`}
function renderSteps(ids){return ids.map(id=>{const x=STEPS[id],s=status(id);return `<button class="checkrow" data-action="step" data-id="${id}"><span class="state-dot ${s==='done'?'done':s==='na'?'na':''}">${s==='done'?icon('check',17):s==='na'?'–':''}</span><span class="checkcopy"><b>${x.title}</b><small>${s==='done'?'Done':s==='na'?"Doesn't apply":x.short}${x.linked?' · '+x.linked:''}</small></span>${icon('chevron',16)}</button>`}).join('')}
function sweep(){const st=S(),p=progress(st),pending=remaining(st),id=state.focus&&st.ids.includes(state.focus)?state.focus:pending[0],x=STEPS[id];if(!id||!x)return `<button class="back" data-action="home">${icon('back')} Safety</button><div class="success-card"><div class="success-mark">${icon('check')}</div><h2>You've reviewed this stage.</h2><p>All ${p.all} checks have been marked done or not applicable. There’s no need to repeat them unless something changes.</p></div><button class="primary" data-action="home">Back to Safety ${icon('arrow')}</button><button class="tertiary" style="width:100%" data-action="library">Find another check</button>`;const n=st.ids.indexOf(id);const ss=status(id);return `<button class="back" data-action="home">${icon('back')} Safety</button>${state.ack?`<p style="font-size:11px;color:#658568;font-weight:750;padding-bottom:9px">✓ ${state.ack}</p>`:``}<header class="page-head"><span class="eyebrow">${st.name.toUpperCase()} · SAFETY SWEEP</span><h1>One check at a time.</h1><p>Work through the spaces Maya can reach. You can come back or change an answer any time.</p></header><div class="progress-head"><b>${p.done} of ${p.all} reviewed</b><span>Check ${n+1} of ${p.all}</span></div><div class="track"><i style="width:${100*p.done/p.all}%"></i></div>${stepBody(id,true)}<button class="linkline" style="margin-top:24px" data-action="toggleList"><span class="small-icon">${icon('list')}</span><span><b>${state.showStageList?'Hide':'See'} all ${p.all} checks for ${st.name.toLowerCase()}</b><small>${p.done} reviewed · jump to any check</small></span>${icon('chevron',16)}</button>${state.showStageList?`<div class="stage-list" style="margin-top:0">${renderSteps(st.ids)}</div>`:``}<p class="tiny-note">Done and “Doesn’t apply” are different. Neither means that the whole home has been certified safe.</p>`}
function stepBody(id,insweep){const x=STEPS[id],s=status(id);return `<section class="focus-card"><div class="focus-upper"><small>${x.zone.toUpperCase()}</small>${s?`<span class="badge ${s==='na'?'na':''}">${s==='done'?'✓ Reviewed':'Doesn’t apply'}</span>`:''}</div><div class="focus-illustration"><span class="mini-art" style="width:93px;height:93px;border-radius:28px;background:#e8e5d7;color:#738c76">${icon(x.icon,48)}</span></div><h2>${x.title}</h2><p>${x.why}</p></section><ol class="steps-list">${x.steps.map((t,i)=>`<li><span class="num">${i+1}</span><span>${t}</span></li>`).join('')}</ol>${x.tip?`<div class="note-box"><strong>Good to know</strong>${x.tip}</div>`:''}${x.linked?`<p class="hint-row">${icon('info',14)} This check also belongs in <b>${x.linked}</b>. The full app would open that guide directly.</p>`:''}${x.source?.length?`<details style="margin-top:14px"><summary style="font-size:11.5px;color:#64806b;cursor:pointer;font-weight:750">Sources and more detail</summary>${x.source.map(([n,u])=>`<a class="resource-link" href="${u}" target="_blank" rel="noopener noreferrer">${n} ${icon('arrow',13)}</a>`).join('')}</details>`:''}<div class="actions">${s==='done'?`<button class="primary" data-action="next" data-id="${id}">Checked ✓ · Next ${icon('arrow')}</button><button class="tertiary" data-action="status" data-id="${id}" data-val="done">Undo check</button>`:s==='na'?`<button class="primary" data-action="next" data-id="${id}">Not applicable · Next ${icon('arrow')}</button><button class="tertiary" data-action="status" data-id="${id}" data-val="na">Change answer</button>`:`<button class="primary" data-action="status" data-id="${id}" data-val="done">Mark as done ${icon('check',17)}</button><button class="secondary" data-action="status" data-id="${id}" data-val="na">Doesn’t apply to our home</button>`}</div>`}
function stepPage(){const id=state.focus;const x=STEPS[id];if(!x)return pageHome();return `<button class="back" data-action="${state.from==='library'?'library':state.from==='sweep'?'sweep':'home'}">${icon('back')} ${state.from==='library'?'All safety checks':state.from==='sweep'?'Safety sweep':'Safety'}</button><div class="page-head"><span class="eyebrow">${x.zone.toUpperCase()} · SAFETY CHECK</span><h1>Make this space ready.</h1><p>Practical steps for Maya’s current and upcoming abilities.</p></div>${stepBody(id,false)}${state.from!=='sweep'?`<button class="tertiary" style="width:100%;margin-top:9px" data-action="home">Back to Safety</button>`:''}`}
function libraryPage(){const q=state.query.toLowerCase().trim();const groups=STAGES.map(st=>({...st,ids:st.ids.filter(id=>STEPS[id].title.toLowerCase().includes(q)||STEPS[id].short.toLowerCase().includes(q)||STEPS[id].zone.toLowerCase().includes(q)||STEPS[id].why.toLowerCase().includes(q))})).filter(st=>st.ids.length);return `<button class="back" data-action="home">${icon('back')} Safety</button><header class="page-head"><span class="eyebrow">EVERY SAFETY CHECK</span><h1>Find what you need.</h1><p>Every check stays available, even after its stage has passed.</p></header><label class="search">${icon('search',19)}<input id="search" type="search" value="${esc(state.query)}" placeholder="Stairs, car seat, cords, pool…" aria-label="Search safety checks"></label><div id="resultPane">${libraryResults(groups)}</div>`}
function esc(x){return String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function libraryResults(groups){return groups.length?groups.map(st=>`<div class="library-group"><div class="between"><h3>${st.name}</h3><span class="pillstatus">${progress(st).done} / ${progress(st).all} reviewed</span></div><div class="stage-list" style="margin-top:0">${renderSteps(st.ids)}</div></div>`).join(''):'<p style="color:#8b958a;padding:30px 0;text-align:center;font-size:13px">No checks match that search.</p>'}
function emergencyPage(){return `<button class="back" data-action="home">${icon('back')} Safety</button><header class="page-head"><span class="eyebrow">QUICK REFERENCE</span><h1>If something goes wrong.</h1><p>Important contacts to know before you need them.</p></header><section class="emergency-item"><b>Someone can't breathe or isn't responding</b><p>Call 911 immediately. For choking, begin age-appropriate first aid if you know it, and follow emergency dispatch instructions.</p><a href="tel:911">Call 911 ${icon('arrow',14)}</a></section><section class="emergency-item"><b>Possible poisoning or swallowed medicine</b><p>Call Poison Help in the US. Don't wait for symptoms or induce vomiting unless instructed by a professional.</p><a href="tel:18002221222">Poison Help · 1-800-222-1222 ${icon('arrow',14)}</a></section><section class="emergency-item"><b>Possible button battery or magnet swallowed</b><p>Seek emergency assessment immediately. Button batteries can cause severe internal injury quickly. Call Poison Help or the National Battery Ingestion Hotline (1-800-498-8666) while arranging emergency care.</p><a href="https://www.poison.org/battery" target="_blank" rel="noopener noreferrer">Button battery emergency advice ${icon('arrow',14)}</a></section><section class="emergency-item"><b>Infant choking first aid</b><p>Review this before an emergency. Ahead's complete step-by-step choking guidance belongs in Feeding.</p><a href="${SOURCES.firstaid}" target="_blank" rel="noopener noreferrer">Read pediatric first-aid guidance ${icon('arrow',14)}</a></section><p class="tiny-note">This reference isn't a substitute for emergency services or clinical assessment.</p>`}
function sheet(){return `<div class="sheet-backdrop" role="presentation" data-action="sheetclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="Preview a baby stage"><div class="sheet-header"><h2>Preview a stage</h2><button class="x" aria-label="Close" data-action="sheetclose">×</button></div><p>Safety is tied to what a baby can reach. Choose a sample age to explore the whole experience.</p>${STAGES.map((st,i)=>`<button class="age-opt" data-action="stage" data-id="${st.id}"><span class="ageball">${['0','5','8','10'][i]}</span><span style="flex:1"><b>${st.age} · ${st.name}</b><small>${['First home setup','Before rolling starts','Before crawling starts','Before pulling up'][i]}</small></span>${state.stage===st.id?icon('check',18):icon('chevron',18)}</button>`).join('')}<button class="secondary" style="margin-top:18px" data-action="milestone">${state.milestones[state.stage]?'✓ Stage already happening · Change':'Maya already started '+S().name.toLowerCase()+'?'}</button><p style="margin-top:12px">In the real app, this would use developmental information parents already shared. The preview uses this stage picker to test scenarios.</p></div></div>`}
function render(scroll=false){const labels={setup:'Newborn',rolling:'5 months',crawling:'8 months',pulling:'10 months'};qs('#baby').innerHTML='Maya · '+labels[state.stage]+' '+icon('chevron',13);qs('#main').innerHTML=state.view==='home'?pageHome():state.view==='sweep'?sweep():state.view==='step'?stepPage():state.view==='library'?libraryPage():emergencyPage();qs('#overlay').innerHTML=state.openSheet?sheet():'';if(scroll)window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{if(e.target.closest('#baby')){state.openSheet=true;qs('#overlay').innerHTML=sheet();return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;if(a==='sheetclose'){if(e.target.closest('.sheet')&&btn.classList.contains('sheet-backdrop'))return;state.openSheet=false;render();return}if(a==='stage'){walkStage(id);return}if(a==='milestone'){state.milestones[state.stage]=!state.milestones[state.stage];persist();render();state.openSheet=true;qs('#overlay').innerHTML=sheet();return}if(a==='home'){changeView('home');return}if(a==='sweep'){state.view='sweep';state.focus=remaining(S())[0]||S().ids[0];state.showStageList=false;state.ack='';render(true);return}if(a==='toggleList'){state.showStageList=!state.showStageList;render();return}if(a==='earlier'){const prev=STAGES.slice(0,STAGES.findIndex(x=>x.id===state.stage)).find(st=>remaining(st).length);if(prev){walkStage(prev.id);state.view='sweep';state.focus=remaining(prev)[0];render(true)}return}if(a==='step'){state.from=state.view==='sweep'?'sweep':state.view==='library'?'library':'home';state.focus=id;state.view='step';render(true);return}if(a==='status'){setStatus(id,btn.dataset.val);return}if(a==='next'){const ids=S().ids,pending=ids.filter(x=>!reviewed(x));const n=pending[0];state.view='sweep';state.focus=n||null;render(true);return}if(a==='library'){changeView('library');return}if(a==='emergency'){changeView('emergency');return}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;const q=state.query.toLowerCase().trim();let g=STAGES.map(st=>({...st,ids:st.ids.filter(id=>STEPS[id].title.toLowerCase().includes(q)||STEPS[id].short.toLowerCase().includes(q)||STEPS[id].zone.toLowerCase().includes(q)||STEPS[id].why.toLowerCase().includes(q))})).filter(st=>st.ids.length);qs('#resultPane').innerHTML=libraryResults(g)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.openSheet){state.openSheet=false;render()}});
render();window.__safetyPreview={state,STEPS,STAGES,status,render};
})();
</script>
</body></html>
