<script>
// This page deliberately renders the existing Ahead app, not a re-created mock.
// Demo data live in memory and never write to the real baby profile.
(function(){
  window.OA_COMPANION = true;
  function setDemoAge(m) {
    const n=Number(m),d=new Date(NOW.getFullYear(),NOW.getMonth()-n,Math.min(12,NOW.getDate()));
    const feed=document.getElementById('oa-feed')?.value || 'Both';
    profile={...demo, name:'Maya',pronouns:'she', dob:iso(d),due:'',early:false,feed,feedHow:feed==='Breast milk'?'Nursing':feed==='Formula'?'Formula':'Pumping',example:true};
    month=actualMonth();
  }
  window.oaDemoAge=m=>{window.oaKitClose();setDemoAge(m);if(page==='welcome'||page==='setup')openPage('chg:Out and about:s');else render()};
  window.oaDemoFeed=feed=>{window.oaKitClose();profile.feed=feed;profile.feedHow=feed==='Breast milk'?'Nursing':feed==='Formula'?'Formula':'Pumping';render()};
  window.oaCompare=enabled=>{
    window.oaKitClose();
    window.OA_COMPANION=enabled;
    document.getElementById('oa-before').classList.toggle('is-active',!enabled);
    document.getElementById('oa-after').classList.toggle('is-active',enabled);
    document.getElementById('oa-before').setAttribute('aria-pressed',String(!enabled));
    document.getElementById('oa-after').setAttribute('aria-pressed',String(enabled));
    render();
  };
  setDemoAge(6);
  window.oaCompare(true);
  openPage('chg:Out and about:s');
})();
