{id:'bath',title:'Give a tub bath',section:'How to',icon:'bath',sub:'Warm water, a safe hold, and a simple routine',intro:'Once the cord stump has fallen off and the area has healed, a baby tub is an option.',steps:['Gather a clean diaper, towel, washcloth, and gentle baby wash before starting.','Put a small amount of warm water in a baby tub—around 100°F, comfortably warm rather than hot.','Support Maya’s head and neck and keep a hand on her throughout.','Wash gently, then lift her out, wrap in a towel, and pat the creases dry.'],important:'Never leave a baby alone in water or rely on a bath seat as a substitute for supervision.',walk:true},

{id:'diaper',title:'Change a diaper',section:'How to',icon:'diaper',sub:'Including rolling and wriggling',intro:'A simple sequence keeps changes quick, gentle, and safe.',steps:['Set out a fresh diaper, wipes, and cream within reach.','Open the old diaper and wipe front to back; clean gently into skin folds.','Let the skin dry and apply barrier cream if needed.','Slide a clean diaper underneath and fasten comfortably.'],important:'Keep one hand on a baby on raised changing surfaces. Floor changes can be easier once rolling starts.',walk:true},

{id:'teeth',title:'Care for gums & teeth',section:'How to',icon:'tooth',sub:'Teething, brushing, and the first dentist visit',intro:'As soon as the first tooth comes in, brush twice a day.',steps:['Use a soft, small baby toothbrush.','Apply a tiny smear of fluoride toothpaste about the size of a grain of rice.','Gently brush every tooth twice a day.','Plan a dental visit within six months of the first tooth, and by age one.'],important:'Avoid numbing teething gels and teething necklaces.',walk:false},
{id:'sun',title:'Keep baby sun-safe',section:'How to',icon:'sun',sub:'Shade, clothing, and sunscreen by age',intro:'Shade and protective clothing come first for every age.',steps:['Seek shade and avoid long periods in direct sun.','Use breathable protective clothing and a brimmed hat.','At six months or older, use broad-spectrum SPF 30+ on exposed skin.','Reapply as directed, especially after swimming.'],important:'For babies under six months, ask a clinician about sunscreen on small exposed areas when shade and clothing are unavailable.',walk:false},

 {id:'cordcare',title:'Care for the cord stump',icon:'heart',sub:'Keep it dry and know what healing looks like',intro:'The stump usually dries and separates within the first one to three weeks.',steps:['Fold the diaper below the stump to keep it exposed to air.','Keep the area clean and dry; use a little water if it becomes dirty and pat dry.','Let the stump detach on its own.'],important:'Call your pediatrician for spreading redness, foul-smelling discharge, pus, fever, or a stump that has not fallen off after three weeks.',related:['sponge','bath'],source:'https://www.healthychildren.org/English/ages-stages/baby/bathing-skin-care/Pages/Umbilical-Cord-Care.aspx',stage:'The umbilical stump is a newborn care task. Once the area heals, switch to tub-bath guidance.'},
 {id:'firstdiapers',title:'Diapers in the first week',icon:'diaper',sub:'Wet diapers, changing, and newborn poop',intro:'Wet diapers gradually increase in the first days as feeding gets established.',steps:['Look for roughly 1 wet diaper on day 1, 2 on day 2, and progressively more during the first week.','By around day 5–6, many babies have at least 6 wet diapers in 24 hours.','Track the general pattern if your clinician asks, especially if there are feeding or weight concerns.'],important:'Fewer wet diapers than expected, dark or persistent brick-red urine stains, poor feeding, or lethargy need prompt clinical advice. These counts are guides, not a substitute for your care team’s plan.',visual:'wet',related:['diaper','poop','downthere'],stage:'These daily wet-diaper benchmarks matter especially during the first week.'},
 {id:'downthere',title:'Clean the diaper area',icon:'diaper',sub:'Gentle care for girls and boys, including circumcision',intro:'Gentle cleaning at each change is enough for most babies. Some newborn appearances can be surprising but normal.',steps:['Wipe from front to back and clean gently into the folds.','Pat dry and put on a fresh diaper.','Follow the appropriate guidance below for anatomy or circumcision care.'],important:'Call for persistent bleeding, swelling, pus, pain with urination, or no urine after a procedure. Follow the instructions from your baby’s treating clinician.',visual:'anatomy',related:['diaper','diaperrash'],stage:'The most specific newborn guidance is for the first days after birth or a circumcision.'},
 {id:'diapersize',title:'Know when to size up',icon:'diaper',sub:'Fit, leaks, and red marks',intro:'Diaper sizes vary by brand and baby; the fit matters more than an exact weight or age.',steps:['Check that tabs fasten comfortably and you can fit about two fingers at the waist.','Size up when there are frequent leaks, red marks, or the tabs no longer reach comfortably.','Keep a few of the next size on hand.'],important:'Very red, broken, or painful skin may be diaper irritation, not just a sizing problem.',related:['diaper','diaperrash']},
 {id:'diaperrash',title:'Care for diaper rash',icon:'skin',sub:'Irritation, barrier cream, and when yeast looks different',intro:'Typical diaper irritation is red where the diaper touches. Bright red folds and satellite spots can suggest a yeast rash.',steps:['Change wet or dirty diapers promptly and clean gently without scrubbing.','Let skin air-dry briefly, then apply a thick layer of zinc-oxide or petroleum-jelly barrier.','Avoid fragranced products and ask your clinician if the rash does not improve.'],important:'Contact a pediatrician for a rash that worsens or does not improve in 2–3 days, fever, blisters, pus, significant pain, or a bright red fold rash needing different treatment.',visual:'rash',related:['diaper','downthere','skin']},
 {id:'poop',title:'Understand poop & wet diapers',icon:'diaper',sub:'Colors, frequency, solids, and when to call',intro:'Poop changes with age, milk feeding, and solids. Color, texture, feeding, and wet diapers together tell a fuller story.',steps:['Compare the color with the visual guide below.','Consider whether stools are soft or hard, and if feeding and wet diapers are normal.','Seek advice for white, gray, bloody, or persistent black stool after the first days, hard painful stools, or dehydration signs.'],important:'White, gray, or chalky stool needs prompt pediatric advice. Black meconium is expected only in the first days; persistent black stool later needs assessment.',visual:'poop',related:['firstdiapers','diaperrash','diaper'],stage:'At 3–6 weeks, stool frequency may drop in breastfed babies. With solids, poop often becomes thicker, smellier, and may contain food bits.'},
 {id:'haircare',title:'Wash baby’s hair',icon:'bath',sub:'How often, cradle cap, and gentle rinsing',intro:'A little mild baby shampoo a few times a week is enough for most babies.',steps:['Support your baby securely while washing.','Use a small amount of mild baby shampoo, or plain water if that works for your baby.','Rinse gently with a wet washcloth, keeping water away from the eyes, then pat dry.'],important:'Do not pick at cradle-cap scales. If the scalp is swollen, bleeding, or oozing, contact your pediatrician.',related:['bath','sponge','skin']},
 {id:'bigtub',title:'Move to the big tub',icon:'bath',sub:'When sitting changes bath time',intro:'Once a baby sits steadily without support, some families transition from a baby tub to a regular bathtub.',steps:['Place a non-slip mat and use only a small amount of warm water.','Stay within arm’s reach and keep your attention on your baby.','Expect pulling up and reaching; gently sit baby back down if needed.'],important:'Never leave a baby alone in water—even with a bath seat. Bath seats can tip or let babies slip through.',visual:'sit',related:['bath'],stage:'This change is based on sitting ability, not simply a particular month.'},
 {id:'suncare',title:'Shade, sunscreen & heat',icon:'sun',sub:'By age, plus hot-day hydration and stroller safety',intro:'Protect from direct sunlight with shade, clothing, and a hat. From around six months, sunscreen can be added.',steps:['Prioritize shade, lightweight long sleeves, and a wide-brimmed hat.','From six months, use broad-spectrum SPF 30+ on exposed skin and reapply according to the label.','On hot days, seek cooler places, offer usual milk feeds more often, and never cover the stroller with a blanket.'],important:'Any sunburn in a young infant needs pediatric advice. A child who is very hot, difficult to wake, floppy, or not feeding may need emergency evaluation.',visual:'sun',related:['sun','clothes','pool']},
 {id:'pool',title:'Prepare for the pool or beach',icon:'sun',sub:'Water, clothing, and keeping baby cool',intro:'Water outings add some simple care needs: shade, a swim diaper, and constant supervision.',steps:['Pack a swim diaper, sun-protective clothing, hat, towel, and extra dry clothes.','Choose shade; from six months add sunscreen to exposed skin.','Hold or stay within immediate reach of your baby in or near water.'],important:'A swim diaper does not prevent drowning; never rely on a float, toy, or seat for safety.',related:['suncare','bigtub']},
 {id:'hotdays',title:'Help baby stay comfortable in heat',icon:'sun',sub:'Layers, temperature, shade, and hydration',intro:'Babies can overheat more easily than adults. The right clothing and shade matter.',steps:['Use light breathable clothing and choose shade or a cool indoor space.','Check the chest or back for overheating rather than relying only on hands and feet.','Offer usual milk feeds more frequently if needed; do not cover a stroller with a blanket.'],important:'Hard to wake, floppy, trouble breathing, or other signs of serious heat illness require immediate medical help.',related:['clothes','suncare']},
 {id:'carseat',title:'Dress for the car seat',icon:'shirt',sub:'Why puffy coats go over, not under, the straps',intro:'Bulky clothing can prevent car-seat straps from fitting snugly.',steps:['Remove a puffy coat or snowsuit before buckling.','Tighten the harness according to the seat instructions.','Add a blanket or coat over the secured harness if it’s cold.'],important:'Follow the car-seat manufacturer’s instructions and avoid loose items behind the child or beneath the harness.',related:['clothes']},
 {id:'gums',title:'Clean gums before teeth',icon:'tooth',sub:'A simple habit before brushing begins',intro:'Gently wiping gums can help a baby get used to mouth care.',steps:['Wrap a clean, soft, damp washcloth around your finger.','Wipe the gums gently, for example after a feed and before bed.','Once a tooth appears, switch to a soft baby toothbrush and a rice-grain-size smear of fluoride toothpaste.'],important:'Small white gum cysts in newborns are often harmless, but persistent or unusual mouth lesions should be discussed with a pediatrician.',related:['teething','teeth']},
 {id:'teething',title:'Soothe teething gums',icon:'tooth',sub:'What helps, and products to avoid',intro:'Drooling, mouthing, and tender gums often happen around the time teeth begin appearing, but these signs are not proof that a tooth is imminent.',steps:['Rub the gums gently with a clean finger.','Offer a firm teething ring chilled in the refrigerator, not frozen solid.','Avoid teething necklaces, numbing gels, and homeopathic teething tablets.'],important:'A true fever, significant diarrhea, or a sick-looking baby should not be explained away as teething.',related:['gums','teeth']},

if(kind==='roll')return `<svg viewBox="0 0 185 175" fill="none"><ellipse cx="100" cy="145" rx="75" ry="15" fill="#C8D9C7"/><circle cx="105" cy="75" r="57" fill="#DBE4D8"/><rect x="38" y="98" width="127" height="40" rx="16" fill="#C7DDCC"/><ellipse cx="112" cy="110" rx="43" ry="24" fill="#A9C3B5"/><circle cx="73" cy="91" r="25" fill="#E2B8A0"/><path d="M49 90q-5-25 20-26 23 2 25 21-10-9-18-11-8 13-27 16" fill="#66564C"/><circle cx="66" cy="91" r="2" fill="#55483D"/><circle cx="80" cy="91" r="2" fill="#55483D"/><path d="M65 104q8 5 13-1" stroke="#9E7564" stroke-width="2"/><path d="M122 92q21-20 39-2" stroke="#E2B8A0" stroke-width="13" stroke-linecap="round"/><circle cx="163" cy="94" r="8" fill="#E2B8A0"/></svg>`;
if(kind==='tooth')return `<svg viewBox="0 0 185 175" fill="none"><circle cx="96" cy="85" r="70" fill="#E5DCE4"/><path d="M68 54q-15-8-19 10-2 25 10 53 7 16 16 2l10-32q9-12 15 1l10 31q9 14 16-2 13-28 9-53-3-18-19-10-15 11-25 6-14-5-23-6z" fill="#FFFFFA" stroke="#D8D2D3" stroke-width="3"/><path d="M79 81h3m26 0h3" stroke="#A98E95" stroke-width="3" stroke-linecap="round"/><path d="M88 96q8 8 15 0" stroke="#A98E95" stroke-width="2" stroke-linecap="round"/><circle cx="149" cy="51" r="7" fill="#FFF"/></svg>`;
return `<svg viewBox="0 0 185 175" fill="none"><circle cx="91" cy="82" r="69" fill="#E3EAE1"/><circle cx="90" cy="83" r="41" fill="#E5BFA7"/><path d="M54 75q-6-32 29-35 36 0 46 33-15-17-38-17-17 17-37 19" fill="#84766C"/><circle cx="76" cy="84" r="3" fill="#594F48"/><circle cx="106" cy="84" r="3" fill="#594F48"/><path d="M77 101q14 10 29 0" stroke="#986E60" stroke-width="2"/><circle cx="67" cy="94" r="5" fill="#D29A90" opacity=".6"/><circle cx="114" cy="94" r="5" fill="#D29A90" opacity=".6"/></svg>`}
function miniArt(id){let k=id==='acne'||id==='milia'||id==='peeling'||id==='mark'?'face':id==='cradle'?'scalp':id==='hair'?'hair':id==='drool'?'drool':id==='teething'||id==='tooth'?'teeth':id==='sunscreen'?'sun':id==='steps'?'feet':'other';let base='<circle cx="34" cy="30" r="28" fill="#F1E9E1"/>';if(k==='face')base+='<circle cx="34" cy="32" r="20" fill="#E7BEA8"/><path d="M16 27q-3-17 17-18t20 18q-9-10-17-10-7 8-20 10" fill="#77685F"/><circle cx="27" cy="34" r="1.4" fill="#665449"/><circle cx="40" cy="34" r="1.4" fill="#665449"/><path d="M30 43q5 3 8 0" stroke="#A57A70" fill="none"/>'+(['mark'].includes(id)?'<circle cx="43" cy="27" r="5" fill="#D8877E"/>':'<circle cx="22" cy="39" r="2.4" fill="#D7968D"/><circle cx="26" cy="42" r="1.5" fill="#D7968D"/><circle cx="45" cy="38" r="2.8" fill="#D7968D"/>');else if(k==='scalp'||k==='hair')base+='<path d="M13 35q-3-27 20-29 23-3 24 29" fill="#806B5F"/><path d="M16 34q15-8 36 0" stroke="#E4BDA3" stroke-width="6"/><path d="M19 18q20 9 30 2" stroke="#C8B39A" stroke-width="3" stroke-dasharray="3 4"/>';else if(k==='drool')base+='<path d="M35 9q-17 23-17 35a17 17 0 0 0 34 0Q52 32 35 9Z" fill="#9BC8C5"/><path d="M27 46q8 7 16 0" stroke="#fff" stroke-width="3"/>';else if(k==='teeth')base+='<path d="M20 18q-10-4-8 15l7 22q3 6 7-2l8-17 8 17q5 8 8 0l6-20q4-19-8-15-13 4-14 4-7-5-14-4z" fill="#fff" stroke="#D7D3CD"/>';else if(k==='sun')base+='<circle cx="34" cy="30" r="12" fill="#E9C76B"/>'+Array.from({length:8},(_,i)=>{let a=i*Math.PI/4;let x1=34+17*Math.cos(a),y1=30+17*Math.sin(a),x2=34+25*Math.cos(a),y2=30+25*Math.sin(a);return `<path d="M${x1} ${y1} ${x2} ${y2}" stroke="#E9C76B" stroke-width="3" stroke-linecap="round"/>`}).join('');else base+=`<g stroke="#789784" fill="none" stroke-width="3"><path d="M20 28q5-21 14 0v14M34 25q5-24 14 0v21"/><circle cx="34" cy="36" r="14"/></g>`;return `<svg viewBox="0 0 68 62" aria-hidden="true">${base}</svg>`}
function go(tab){state.tab=tab;state.view='home';state.selected=null;state.finding=null;scrollUp();render()}
function openGuide(id){state.view='detail';state.from=state.tab;state.guide=id;state.walkStep=0;scrollUp();render()}
function openChange(id){state.view='change';state.from=state.tab;state.selected=id;scrollUp();render()}
function startWalk(){state.view='walk';state.walkStep=0;scrollUp();render()}
function back(){if(state.view==='walk'){state.view='detail'}else if(state.view==='change'||state.view==='detail'){state.view='home';state.tab=state.from}else{state.view='home'}scrollUp();render()}
function setAge(a){state.age=a;state.sheet=false;state.view='home';state.tab='now';state.selected=null;state.finding=null;state.search='';state.more=false;state.showFindings=false;state.openGroup=null;state.showRoutine=false;scrollUp();render()}
function bottom(){return [['now','sparkles','What’s new'],['how','book','How-to'],['check','eye','Is this normal?']].map(([id,ic,title])=>`<button class="nav ${state.tab===id?'active':''}" data-act="tab" data-id="${id}" aria-current="${state.tab===id?'page':'false'}">${icon(ic)}<span>${title}</span></button>`).join('')}
function home(){const d=datasets[state.age],h=d.hero,ones=state.more?d.looks:d.looks.slice(0,3);return `<div class="page-head"><h1 class="page-title">Everyday care</h1><p class="desc">Little changes. Everyday confidence.</p></div><article class="hero ${h.type}"><span class="eyebrow">${h.label}</span><div class="hero-art">${art(h.art)}</div><h2>${h.title}</h2><p>${h.text}</p><button data-act="guide" data-id="${h.guide}">${esc(h.cta)} ${icon('arrow',16)}</button></article><div class="sub-head"><h2>${d.headline}</h2><small>${months[state.age]}</small></div><div class="chips">${ones.map(id=>`<button class="chip" data-act="change" data-id="${id}"><span class="chip-img">${miniArt(id)}</span><span>${esc(changes[id].name)}</span></button>`).join('')}</div>${d.looks.length>3?`<button class="small-link" data-act="more">${state.more?'Show fewer':`See all ${d.looks.length} changes`} ${icon('arrow',13)}</button>`:''}<div class="next-box"><div class="calendar">${icon('calendar',19)}</div><div class="next-copy"><small>LOOKING AHEAD</small><b>${d.teaser}</b></div><button data-act="ahead" aria-label="Explore next change">${icon('chev',17)}</button></div><p class="footer-caption">Tap a change to see what it means, what helps, and when to call.</p>`}
function how(){const q=state.search.toLowerCase().trim(),results=guides.filter(g=>(g.title+' '+g.sub+' '+g.intro).toLowerCase().includes(q));return `<header class="panel-head"><span class="eyebrow">REACH FOR THIS WHEN YOU NEED IT</span><h2>Show me how</h2><p>Step-by-step help for the little things you do again and again.</p></header><label class="search">${icon('search',18)}<input id="guideSearch" type="search" placeholder="Baths, nails, diapers…" value="${esc(state.search)}" aria-label="Search care how-to guides"></label><div id="guideResults">${howRows(results)}</div>`}
function howRows(items){return items.length?`<p class="group-title">${state.search?'RESULTS':'EVERYDAY ESSENTIALS'}</p>${items.map(g=>`<button class="guide-row" data-act="guide" data-id="${g.id}"><span class="row-icon">${icon(g.icon)}</span><span class="row-copy"><b>${g.title}</b><small>${g.sub}</small></span><span class="arrow">${icon('chev',17)}</span></button>`).join('')}`:'<p class="empty">No guides match that search.</p>'}
const categories=[['skin','skin','Skin & rashes','Bumps, flakes, and irritation'],['poop','diaper','Poop & diapers','Color, frequency, and constipation'],['cord','heart','Belly button','The stump and healing'],['eyes','eye','Eyes & nose','Tears, stickiness, and snuffles'],['gums','tooth','Gums & teeth','Teething and fever']];
function check(){let t=state.issue,opts=issues[t]||issues.skin;return `<header class="panel-head"><span class="eyebrow">A LITTLE REASSURANCE</span><h2>Something look off?</h2><p>Start with what you’re seeing—not a medical name.</p></header><div class="lookup-grid">${categories.map(([id,ic,title,sub])=>`<button class="lookup ${state.issue===id?'selected':''}" data-act="issue" data-id="${id}"><span class="tiny-icon">${icon(ic)}</span><span>${title}</span></button>`).join('')}</div><p class="question-label">What does it look like?</p>${opts.map(([id,title,sub])=>`<button class="option ${state.finding===id?'selected':''}" data-act="finding" data-id="${id}"><span class="mini">${icon(t==='skin'?'skin':t==='poop'?'diaper':t==='gums'?'tooth':t==='cord'?'heart':'eye')}</span><span><b>${title}</b><small>${sub}</small></span>${state.finding===id?icon('check',17):''}</button>`).join('')}${state.finding?resultBox(state.finding):''}<p class="warn-note"><b>Not a diagnosis.</b> If Maya has trouble breathing, is difficult to wake, or seems seriously ill, seek emergency care. A baby under three months with a rectal temperature of 100.4°F (38°C) or higher needs immediate medical evaluation.</p>`}
function resultBox(id){const r=answers[id]||changes[id];if(!r)return'';return `<article class="answer-box"><span class="pill">WHAT IT COULD MEAN</span><h3>${r.title}</h3><p>${r.body}</p><div class="two-info"><strong>What helps</strong><p>${r.help}</p></div><div class="two-info warn"><strong>When to get help</strong><p>${r.call}</p></div></article>`}
function guidePage(){const g=guides.find(x=>x.id===state.guide)||guides[0];let bath=g.id==='bath';return `<button class="back" data-act="back">${icon('back',18)} Back to ${state.from==='now'?"what’s new":'how-tos'}</button><div class="detail-top"><span class="eyebrow">EVERYDAY CARE · HOW-TO</span><h2>${g.title}</h2><p>${g.intro}</p></div>${bath?`<div class="summary-box">${icon('sparkles',20)}<div><b>Has the cord fallen off and healed?</b><p>The first tub bath depends on the cord area healing.</p><div class="mini-tabs">${[['unknown','Not sure'],['no','Not yet'],['yes','Yes']].map(([k,t])=>`<button data-act="cord" data-id="${k}" class="${state.cord===k?'selected':''}">${t}</button>`).join('')}</div>${state.cord==='yes'?'<p>Great! A baby tub is an option now.</p>':`<p>${state.cord==='no'?'Stick with sponge baths for now.':'If you are unsure, choose a sponge bath until you can confirm it is healed.'}</p><button class="small-link" data-act="guide" data-id="sponge">See sponge baths ${icon('arrow',13)}</button>`}</div></div>`:''}<div class="detail-list"><h3 class="detail-title">The simple steps</h3>${g.steps.map((s,i)=>`<div class="fact"><span class="num">${i+1}</span><p>${s}</p></div>`).join('')}</div><p class="note"><b>Always remember:</b> ${g.important}</p>${g.walk?`<button class="primary" style="margin-top:18px" data-act="walk">Walk me through it ${icon('arrow',16)}</button>`:''}${g.id==='skin'?`<button class="secondary" style="width:100%;margin-top:10px" data-act="tab" data-id="check">Check a skin change</button>`:''}`}
function changePage(){const r=changes[state.selected]||changes.acne;return `<button class="back" data-act="back">${icon('back',18)} Back to what's new</button><div class="detail-top" style="background:#f3eae4"><span class="eyebrow">YOU MAY BE NOTICING</span><div style="width:85px;height:90px;margin:0 auto">${miniArt(state.selected)}</div><h2>${r.title}</h2><p>${r.body}</p></div><div class="detail-list"><h3 class="detail-title">What helps</h3><p style="font-size:13px;line-height:1.7">${r.help}</p></div><p class="note"><b>When to check with your pediatrician:</b> ${r.call}</p><button class="secondary" style="width:100%;margin-top:15px" data-act="tab" data-id="check">Something else look off?</button>`}
function walkPage(){const g=guides.find(x=>x.id===state.guide)||guides[0],step=state.walkStep;return `<button class="back" data-act="back">${icon('back',18)} Back to guide</button><div class="panel-head"><span class="eyebrow">FOLLOW ALONG</span><h2>${g.title}</h2><p>One small step at a time. Everything is here when you need it.</p></div><div class="walk-card"><div class="walk-art">${art(g.icon==='diaper'?'roll':'bath')}</div><p class="walk-count">STEP ${step+1} OF ${g.steps.length}</p><h3>${['Get ready','Then','Next','Finish up','All done'][Math.min(step,4)]}</h3><p>${g.steps[step]}</p></div><div class="dots">${g.steps.map((s,i)=>`<span class="dot ${i===step?'active':''}"></span>`).join('')}</div><p class="note" style="margin-top:15px">${g.important}</p><div class="walk-ctrl"><button class="secondary" data-act="walkPrev">${step===0?'Close':'Back'}</button><button class="primary" data-act="walkNext">${step===g.steps.length-1?'Done':'Next step'} ${icon('arrow',15)}</button></div>`}
function overlay(){if(!state.sheet)return'';return `<div class="popover" id="popover" role="presentation"><div class="sheet" role="dialog" aria-modal="true" aria-label="Preview age"><button class="close" data-act="sheetClose" aria-label="Close">${icon('x')}</button><span class="eyebrow">PREVIEW AN AGE</span><h2>See how care changes</h2><p>Four sample moments from Maya’s first year.</p>${[['newborn','Newborn','First weeks'],['five','5 weeks','Skin and first baths'],['six','6 months','Movement and drool'],['older','10 months','Teeth, tubs, and first steps']].map(([id,label,desc])=>`<button class="age-opt ${state.age===id?'on':''}" data-act="age" data-id="${id}"><span>${label}</span><small>${desc} ${state.age===id?'✓':''}</small></button>`).join('')}</div></div>`}
function render(keep=false){$('#babyLabel').textContent='Maya · '+months[state.age];const title=state.view==='home'?(state.tab==='now'?homeComplete():state.tab==='how'?howComplete():checkComplete()):state.view==='detail'?guideComplete():state.view==='change'?changeComplete():walkComplete();$('#main').innerHTML=title;$('#bottom').innerHTML=bottom();$('#overlay').innerHTML=overlayComplete();if(!keep){} }
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b){if(e.target.id==='popover'){state.sheet=false;render(true)}return}const act=b.dataset.act,id=b.dataset.id;
switch(act){case 'tab':go(id);state.showFindings=false;break;case 'guide':openGuide(id);break;case 'change':openChange(id);break;case 'back':back();break;case 'more':state.more=!state.more;render(true);break;case 'issue':state.issue=id;state.finding=null;state.showFindings=false;render(true);break;case 'finding':state.finding=state.finding===id?null:id;render(true);if(state.finding)requestAnimationFrame(()=>document.querySelector('#findingAnswer')?.scrollIntoView({block:'nearest',behavior:'smooth'}));break;case 'ahead':setAge(state.age==='newborn'?'five':state.age==='five'?'six':state.age==='six'?'older':'newborn');break;case 'age':setAge(id);break;case 'sheetClose':state.sheet=false;render(true);break;case 'cord':state.cord=id;render(true);break;case 'routine':state.showRoutine=!state.showRoutine;render(true);break;
case 'group':state.openGroup=state.openGroup===id?null:id;render(true);break;
case 'allfindings':state.showFindings=!state.showFindings;render(true);break;
case 'poopcolor':state.poopColor=id;render(true);break;
case 'anatomy':state.anatomy=id;render(true);break;
case 'circumcision':state.circumcision=id;render(true);break;
case 'firsttooth':state.firstTooth=id==='yes';render(true);break;
case 'sitting':state.sitting=id==='yes';render(true);break;
case 'feed':state.feed=id;render(true);break;
case 'solids':state.solids=id==='yes';render(true);break;
case 'tick':state.checkedItems[id]=!state.checkedItems[id];saveChecklist();render(true);break;
case 'custom':state.customOpen=!state.customOpen;render(true);break;
case 'togglesolids':state.solids=!state.solids;render(true);break;
case 'toggletooth':state.firstTooth=!state.firstTooth;render(true);break;
case 'togglesitting':state.sitting=!state.sitting;render(true);break;
case 'walk':startWalk();break;case 'walkPrev':if(state.walkStep)state.walkStep--;else state.view='detail';render(true);break;case 'walkNext':{const guide=guides.find(x=>x.id===state.guide);let n=guide.steps.length;if(guide.id==='bath'&&(state.age==='newborn'||state.age==='five')&&state.cord!=='yes')n=guides.find(x=>x.id==='sponge').steps.length;if(state.walkStep<n-1)state.walkStep++;else state.view='detail';render(true);break;}}}
);document.addEventListener('input',e=>{if(e.target.id==='guideSearch'){state.search=e.target.value;$('#guideResults').innerHTML=state.search?howRows(guides.filter(g=>topicSearchText(g).includes(state.search.toLowerCase().trim()))):'';const groups=$('#guideGroups');if(groups)groups.style.display=state.search?'none':''}});
$('#ageBtn').addEventListener('click',()=>{state.sheet=true;render(true)});
render();
})();
</script></body></html>
