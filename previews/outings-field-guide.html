<script>
(function(){
 function setAge(age){
  const n=Number(age),now=new Date();
  const d=new Date(now.getFullYear(),now.getMonth()-n,Math.min(now.getDate(),12));
  profile={...demo,name:'Maya',pronouns:'she',dob:iso(d),due:'',early:false,feed:document.getElementById('ot-feed').value,feedHow:'',example:true};
  month=actualMonth();
  answers={...answers,solids:n>=6?'Yes':'Not yet'};
 }
 window.otPreviewHome=()=>{month=actualMonth();openPage('chg:Out and about:s')};
 window.otPreviewAge=n=>{setAge(n);render();window.scrollTo(0,0)};
 window.otPreviewFeed=f=>{profile.feed=f;render();window.scrollTo(0,0)};
 setAge(6);
 const view=new URLSearchParams(location.search).get('view');
 const places=['errands','road','fly','away','water','abroad'];
 openPage(places.includes(view)?'chg:Out and about:v3:'+view:'chg:Out and about:s');
})();
