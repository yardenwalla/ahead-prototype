<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A care card from Ahead</title>
<meta name="description" content="Everything you need to look after the little one: feeding, naps, what helps, and who to call.">
<!-- The preview in Messages, WhatsApp and email. The card's details travel in the link itself (?c=…); this page saves nothing. -->
<meta property="og:type" content="website"><meta property="og:site_name" content="Ahead">
<meta property="og:title" content="You’ve been trusted with someone special">
<meta property="og:description" content="Their care card: feeding, naps, what helps and who to call.">
<meta property="og:url" content="https://yardenwalla.github.io/ahead-prototype/card.html">
<meta property="og:image" content="https://yardenwalla.github.io/ahead-prototype/docs/card-preview.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="theme-color" content="#fbe9e2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* The care card, in the app's current look: a soft gradient top card, Sleep-style tiles whose pictures carry the numbers,
   rows with soft colored icon squares, and a calm night card for safe sleep. No emoji. */
:root { --bg: #f7f3ec; --ink: #2f2a33; --muted: #6b6670; --line: #ece5da; --card: #fffdf9;
  --feed: #fdeef2; --feed-ink: #a24d6a; --nap: #fff3dc; --nap-ink: #8a6a2a; --dusk: #f6e8f3; --dusk-ink: #7a4f74; --night: #e3e6f6; --night-ink: #3d4a7a;
  --green: #e6f5ec; --green-ink: #356651; --peach: #fdeee6; --peach-ink: #9a5a3c; --blue: #e7effc; --blue-ink: #46638c }
* { box-sizing: border-box }
html, body { background: var(--bg) }
body { margin: 0; color: var(--ink); font: 16px/1.5 Figtree, system-ui, -apple-system, sans-serif }
main { max-width: 520px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(30px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)) }
.brand { font: 800 24px/1 Nunito, Figtree, sans-serif; letter-spacing: -.02em; margin: 4px 4px 16px } .brand span { color: #b7a48d }
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 22px 22px 24px; background: linear-gradient(160deg, #fbe2e9, #f6eef6 55%, #e7ecfb) }
.hero::after { content: ""; position: absolute; right: -46px; top: -56px; width: 180px; height: 180px; border-radius: 50%; background: #fff; opacity: .4 }
.hero > * { position: relative; z-index: 1 }
.hero-art { display: block; height: 44px; margin: 4px 0 14px } .hero-art svg { height: 100%; width: auto }
.hello { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--feed-ink) }
h1 { margin: 4px 0 6px; font: 800 36px/1.05 Nunito, Figtree, sans-serif; letter-spacing: -.02em }
.intro { margin: 0; color: #5c5361; font-size: 15.5px }
.updated { display: inline-block; margin-top: 12px; padding: 3px 11px; border-radius: 999px; background: rgba(255, 255, 255, .75); font-size: 12.5px; font-weight: 600; color: var(--muted) }
h2 { margin: 24px 4px 10px; font: 700 17px/1.2 Figtree, sans-serif }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tile { padding: 14px 14px 16px; border-radius: 20px; min-width: 0; background: var(--t); color: var(--ti) } .tile.wide { grid-column: 1 / -1 }
.tile-art { display: block; height: 26px; margin-bottom: 10px } .tile-art svg { height: 100%; width: auto; display: block }
.tile small { display: block; font-size: 13px; font-weight: 600 }
.tile b { display: block; font-size: 18px; font-weight: 700; line-height: 1.25; margin-top: 2px; color: var(--ink) }
.tile span { display: block; font-size: 13.5px; color: #5c5361; margin-top: 2px }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px } .times em { font-style: normal; font-size: 13.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .75); color: var(--ink) }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none } .row:first-child { border-top: 0 }
.ic { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--t); color: var(--ti) } .ic svg { width: 22px; height: 22px }
.row-copy { flex: 1; min-width: 0 } .row-copy small { display: block; font-size: 13px; color: var(--muted) } .row-copy b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.35 }
.call-btn { flex: none; font-weight: 700; font-size: 14px; padding: 7px 14px; border-radius: 999px; background: var(--green); color: var(--green-ink) }
.note { margin: 10px 6px 0; color: var(--muted); font-size: 13.5px }
.night { margin-top: 24px; padding: 20px; border-radius: 24px; background: var(--night) }
.night-art { display: block; height: 30px; margin-bottom: 10px } .night-art svg { height: 100%; width: auto }
.night small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--night-ink) }
.night p { margin: 4px 0 0; font-size: 16px; font-weight: 600; line-height: 1.45 } .night span { display: block; margin-top: 8px; font-size: 14px; color: #4c4757 }
.thanks { text-align: center; margin: 22px 8px 0; color: var(--muted); font-size: 15px }
.ahead { margin-top: 20px; padding: 20px; border-radius: 24px; background: var(--card); border: 1px solid var(--line) }
.ahead .brand { font-size: 20px; margin: 0 } .ahead p { margin: 8px 0 14px; font-size: 15px; line-height: 1.45; color: #4c4757 }
.ahead a { display: inline-block; padding: 11px 18px; border-radius: 14px; background: var(--green); color: var(--green-ink); text-decoration: none; font-weight: 700 }
@media (min-width: 700px) { main { padding-top: 48px } h1 { font-size: 42px } }
.empty { margin-top: 10px; padding: 24px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); text-align: center; color: var(--muted) }
</style></head>
<body><main><div class="brand">ahead<span>.</span></div><div id="out"></div></main>
<script src="js/care-card-render.js"></script>
<script>
(function () {
  const out = document.getElementById('out');
  let d = null;
  // The card's details come in the link: ?c=… (survives every messaging app), or #… from older links.
  const raw = new URLSearchParams(location.search).get('c') || location.hash.slice(1);
  try { const b = raw.replace(/-/g, '+').replace(/_/g, '/'); d = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch (e) {}
  if (!d || !d.n) { out.innerHTML = '<div class="empty">This care card link looks incomplete. Ask whoever sent it to share it again.</div>'; return; }
  document.title = `${d.n}’s care card`;
  out.innerHTML = aheadCareCard(d, false);
})();
</script></body></html>
